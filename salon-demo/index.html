<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="نظام إدارة صالونات بالعربي: حجوزات، فواتير ضريبية، عميلات، صلاحيات للموظفات، وتقرير نهاية اليوم. جربيه الحين.">
<meta property="og:title" content="نظام إدارة الصالون | جربي الديمو">

<meta property="og:type" content="website">
<meta property="og:url" content="https://narjes455.github.io/salon-demo/">
<meta name="theme-color" content="#8a2d5c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>نظام إدارة الصالون | نسخة تجريبية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + scrollable tab strip, one working column (max 1100px); lists as quiet rows, cards only for modals and KPIs */
:root{
  --bg:#f8f5f7; --surface:#ffffff; --sunk:#f1ecef; --line:#e4dbe1;
  --ink:#2b1f2a; --muted:#76687a; --accent:#8a2d5c; --accent-ink:#ffffff; --accent-soft:#f5e4ec;
  --ok:#2f7a55; --ok-soft:#e2f2e9; --warn:#a46412; --warn-soft:#fbefd9; --bad:#b23a3a; --bad-soft:#f8e1e1; --info:#3b5f9a; --info-soft:#e3ebf7;
  --display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171216; --surface:#211a20; --sunk:#1c161b; --line:#3a2f38;
  --ink:#f1e9ef; --muted:#ad9fab; --accent:#e58ab4; --accent-ink:#2a0f1d; --accent-soft:#3c2231;
  --ok:#7fd1a6; --ok-soft:#1f3329; --warn:#f0bd6e; --warn-soft:#3a2d18; --bad:#f09a9a; --bad-soft:#3d2222; --info:#9fbcf0; --info-soft:#1f2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171216; --surface:#211a20; --sunk:#1c161b; --line:#3a2f38;
  --ink:#f1e9ef; --muted:#ad9fab; --accent:#e58ab4; --accent-ink:#2a0f1d; --accent-soft:#3c2231;
  --ok:#7fd1a6; --ok-soft:#1f3329; --warn:#f0bd6e; --warn-soft:#3a2d18; --bad:#f09a9a; --bad-soft:#3d2222; --info:#9fbcf0; --info-soft:#1f2a3d; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{min-height:100%}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-size:24px;margin:0;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .date{color:var(--muted);font-size:13px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f > span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi.hl{background:var(--accent-soft);border-color:transparent}
.kpi.hl .v{color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row .time{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;direction:ltr;text-align:right}
.row .main{min-width:0}
.row .who{font-weight:600}
.row .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row.dim{opacity:.6}
.row.simple{grid-template-columns:1fr auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.s-booked{background:var(--info-soft);color:var(--info)}
.s-arrived{background:var(--warn-soft);color:var(--warn)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-cancelled,.s-noshow{background:var(--bad-soft);color:var(--bad)}
.s-void{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.catlabel{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:600;padding:10px 14px 4px;background:var(--sunk);border-top:1px solid var(--line)}
.catlabel:first-child{border-top:0}
.search{max-width:320px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.modal .mf{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;user-select:none}
.chk input{width:auto;margin:0}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.items .it{display:grid;grid-template-columns:1fr 70px 100px 32px;gap:6px;margin-bottom:6px;align-items:center}
.totals{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:18px;font-weight:700;color:var(--accent)}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:40;font-size:14px}
.receipt{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.receipt .rh{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .rh .nm{font-family:var(--display);font-size:22px;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.auth{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px}
.auth h2{text-align:center;color:var(--accent)}
.auth .err{color:var(--bad);font-size:13px;min-height:1.2em}
.userbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.userbox b{color:var(--ink)}
.role{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.demo-bar{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:13px;padding-block:6px}
.demo-accts{display:grid;gap:6px}
.demo-accts button{display:flex;justify-content:space-between;gap:8px;text-align:right;border:1px dashed var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px}
.demo-accts button:hover{border-color:var(--accent)}
@media (max-width:560px){
  .row{grid-template-columns:66px 1fr}
  .row .time{font-size:14px;white-space:nowrap}
  .row .acts{grid-column:1 / -1;justify-content:flex-start}
  .row.simple{grid-template-columns:1fr}
  .items .it{grid-template-columns:1fr 54px 80px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header>
    <div class="demo-bar" id="demoBar" hidden><div class="wrap">نسخة تجريبية للعرض: البيانات وهمية وترجع لوضعها الأصلي إذا حدّثتي الصفحة</div></div>
    <div class="wrap">
      <div class="top">
        <div class="brand"><h1 id="salonName">الصالون</h1><span class="date" id="todayLbl"></span></div>
        <div class="quick">
          <span class="userbox" id="userbox" hidden></span>
          <button class="btn primary" id="qBook" type="button">+ حجز جديد</button>
          <button class="btn" id="qInv" type="button">+ فاتورة</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap" id="view">
    <div class="empty"><b>جاري تحميل بيانات الصالون…</b>الحجوزات والفواتير تظهر هنا بعد ثوانٍ.</div>
  </main>
</div>
<footer class="wrap" style="padding-block:24px 40px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)">
  نظام إدارة الصالونات: حجوزات، فواتير بضريبة 15%، عميلات، موظفات بصلاحيات، وتقرير نهاية اليوم.<br>
  لطلب النظام لصالونك: <a href="https://narjes455.github.io/" style="color:var(--accent)">نرجس العمري</a>
</footer>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = ymd(new Date());
const dayName = s => new Date(s+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const money = n => (Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const SAR = n => `<span class="num">${money(n)}</span> ر.س`;
const r2 = n => Math.round((+n||0)*100)/100;
const t12 = t => { if(!t) return "—"; const [h,m]=t.split(":").map(Number); const ap = h<12?"ص":"م"; const hh = ((h+11)%12)+1; return `${hh}:${pad(m)} ${ap}`; };

const STATUS = {
  booked:{l:"محجوز"}, arrived:{l:"وصلت"}, done:{l:"مكتمل"}, cancelled:{l:"ملغي"}, noshow:{l:"لم تحضر"}
};
const PAY = {cash:"كاش", mada:"مدى / شبكة", transfer:"تحويل", other:"أخرى"};
const TABS = [
  ["bookings","الحجوزات"],["invoices","الفواتير"],["report","تقرير نهاية اليوم"],
  ["clients","العميلات"],["services","الخدمات والأسعار"],["staff","الموظفات"],["settings","الإعدادات"]
];
const DEMO = true;
const ROLES = {admin:"مديرة", reception:"استقبال", stylist:"موظفة"};
const ROLE_TABS = {admin:TABS.map(t=>t[0]), reception:["bookings","invoices","report","clients"], stylist:["bookings"]};
const DEMO_ACCTS = [{u:"admin",p:"1234",label:"المديرة: كل الصلاحيات"},{u:"reception",p:"1234",label:"الاستقبال"},{u:"noura",p:"1234",label:"موظفة (نورة): حجوزاتها فقط"}];
const myRole = () => S.me?.role || "stylist";
const isAdmin = () => myRole()==="admin";
const canBook = () => S.canWrite && myRole()!=="stylist";
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const newSalt = () => { const a=new Uint8Array(12); crypto.getRandomValues(a); return hex(a.buffer); };
async function hashPw(pw, salt){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2", salt:enc.encode(salt), iterations:100000, hash:"SHA-256"}, k, 256));
}
const USER_RE = /^[a-z0-9._-]{3,20}$/;

const S = {
  tab:"bookings", day:TODAY, invDay:TODAY, repDay:TODAY, staffFilter:"", clientQ:"",
  services:[], staff:[], clients:[], bookings:[], invoices:[],
  settings:{name:"الصالون", vatEnabled:true, pricesIncludeVat:false, vatNo:"", address:"", phone:"", footer:"شكراً لزيارتكم"},
  ready:false, canWrite:true, db:null, downloads:null, extra:{},
  me:null, meAt:0, fails:0, lockUntil:0, restored:false
};
const CUTOFF = addDays(TODAY,-90);
const docs = snap => snap.docs.map(d => ({id:d.id, ...d.data()}));
const byId = (arr,id) => arr.find(x => x.id===id);
const staffName = id => byId(S.staff,id)?.name || "";

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function dbErr(e){
  if(e && e.code==="quota_exceeded") toast("قاعدة البيانات ممتلئة. احذفي سجلات قديمة ثم أعيدي المحاولة.");
  else if(e && e.code==="invalid_argument") { S.canWrite=false; toast("ما عندك صلاحية تعديل. اطلبي من صاحبة الصالون صلاحية مساهم."); render(); }
  else toast("تعذر الحفظ، تأكدي من الاتصال وحاولي مرة ثانية.");
  console.error(e);
}

/* ---------- money logic ---------- */
function calcTotals(items, discount, st){
  const gross = r2(items.reduce((s,i)=>s + (+i.price||0)*(+i.qty||1),0));
  const disc = Math.min(r2(discount), gross);
  const after = r2(gross - disc);
  let net, vat, total;
  if(!st.vatEnabled){ net=after; vat=0; total=after; }
  else if(st.pricesIncludeVat){ total=after; vat=r2(after*15/115); net=r2(total-vat); }
  else { net=after; vat=r2(after*0.15); total=r2(net+vat); }
  return {gross, discount:disc, net, vat, total};
}

/* ---------- tabs & render ---------- */
function renderTabs(){
  if(!S.me){ $("#tabs").innerHTML=""; return; }
  const allowed = ROLE_TABS[myRole()];
  $("#tabs").innerHTML = TABS.filter(([k])=>allowed.includes(k)).map(([k,l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${k==="bookings"&&myRole()==="stylist"?"حجوزاتي":l}</button>`).join("");
}
const accounts = () => S.staff.filter(s=>s.username && s.pwHash);
const authMode = () => accounts().length ? "login" : "setup";
function syncMe(){
  if(!S.ready) return;
  if(S.me){
    const f=byId(S.staff,S.me.id);
    if(f) S.me = (f.active!==false && f.pwHash) ? f : null;
    else if(Date.now()-S.meAt > 10000) S.me = null;
  } else if(!S.restored){
    S.restored=true; let sid=null;
    try{ sid=sessionStorage.getItem("salon_me"); }catch(e){}
    const f = sid && byId(S.staff,sid);
    if(f && f.active!==false && f.pwHash){ S.me=f; S.meAt=Date.now(); }
  }
}
function setMe(acc){
  S.me=acc; S.meAt=Date.now();
  try{ sessionStorage.setItem("salon_me", acc?acc.id:""); }catch(e){}
  if(acc) S.tab = ROLE_TABS[acc.role||"stylist"][0];
  render();
}
function vAuth(){
  if(authMode()==="setup"){
    if(!S.canWrite) return `<div class="auth"><h2>${esc(S.settings.name||"الصالون")}</h2><div class="muted">النظام لم يُجهّز بعد. صاحبة الصالون تنشئ الحسابات أول مرة.</div></div>`;
    return `<form class="auth" id="setupForm"><h2>تجهيز النظام</h2>
      <div class="small muted">أنشئي حساب المديرة أولاً. بعدها تضيفين حساب لكل موظفة من تبويب "الموظفات".</div>
      <label class="f"><span>الاسم</span><input id="su-name" required></label>
      <label class="f"><span>اسم المستخدم (إنجليزي)</span><input id="su-user" required autocomplete="username" dir="ltr" autocapitalize="none"></label>
      <label class="f"><span>كلمة المرور (٤ خانات على الأقل)</span><input id="su-pw" type="password" required autocomplete="new-password" dir="ltr"></label>
      <label class="f"><span>تأكيد كلمة المرور</span><input id="su-pw2" type="password" required autocomplete="new-password" dir="ltr"></label>
      <div class="err" id="authErr" role="alert"></div>

async function doLogin(){
  const err=$("#authErr");
  if(Date.now()<S.lockUntil){ err.textContent=`محاولات كثيرة. انتظري ${Math.ceil((S.lockUntil-Date.now())/1000)} ثانية.`; return; }
  const u=$("#li-user").value.trim().toLowerCase(), p=$("#li-pw").value;
  const acc=accounts().find(s=>s.username.toLowerCase()===u);
  if(acc && acc.active!==false && await hashPw(p, acc.pwSalt)===acc.pwHash){ S.fails=0; setMe(acc); return; }
  if(++S.fails>=5){ S.lockUntil=Date.now()+30000; S.fails=0; }
  err.textContent = (acc && acc.active===false) ? "هذا الحساب موقوف. راجعي المديرة." : "اسم المستخدم أو كلمة المرور غير صحيحة.";
}
async function doSetup(){
  const err=$("#authErr");
  const name=$("#su-name").value.trim(), u=$("#su-user").value.trim().toLowerCase(), p=$("#su-pw").value;
  if(!USER_RE.test(u)){ err.textContent="اسم المستخدم بالإنجليزي من ٣ إلى ٢٠ (حروف، أرقام، . _ -)."; return; }
  if(p.length<4){ err.textContent="كلمة المرور لازم ٤ خانات على الأقل."; return; }
  if(p!==$("#su-pw2").value){ err.textContent="كلمتا المرور غير متطابقتين."; return; }
  try{
    const salt=newSalt(), ref=S.db.collection("staff").doc();
    const acc={name, specialty:"مديرة الصالون", phone:"", role:"admin", username:u, pwSalt:salt, pwHash:await hashPw(p,salt), active:true};
    await ref.set(acc); setMe({id:ref.id, ...acc}); toast("تم إنشاء الحساب");
  }catch(e){ dbErr(e); }
}

/* days older than the live window are fetched once on demand */
async function ensureDay(day){
  if(day >= CUTOFF || S.extra[day] || !S.db) return;
  S.extra[day] = {bookings:[], invoices:[], loading:true};
  try{
    const [b,i] = await Promise.all([
      S.db.collection("bookings").where("date","==",day).get(),
      S.db.collection("invoices").where("date","==",day).get()
    ]);
    S.extra[day] = {bookings:docs(b), invoices:docs(i)};
  }catch(e){ S.extra[day] = {bookings:[], invoices:[]}; }
  render();
}
const dayBookings = day => (day>=CUTOFF ? S.bookings : (S.extra[day]?.bookings||[])).filter(b=>b.date===day).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
const dayInvoices = day => (day>=CUTOFF ? S.invoices : (S.extra[day]?.invoices||[])).filter(x=>x.date===day).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

function dateBar(key){

    ${d!==TODAY?`<button class="btn ghost sm" data-dset="${key}" type="button">اليوم</button>`:""}

function reportData(day){
  const bk = dayBookings(day), inv = dayInvoices(day).filter(x=>!x.void);
  const cnt = k => bk.filter(b=>b.status===k).length;
  const pay = {}; const stf = {}; const svc = {};
  let sum=0, vat=0, net=0, disc=0;
  inv.forEach(x=>{
    sum+=+x.total||0; vat+=+x.vat||0; net+=+x.net||0; disc+=+x.discount||0;
    pay[x.pay] = (pay[x.pay]||0) + (+x.total||0);
    const sn = staffName(x.staffId)||"بدون موظفة"; stf[sn] = stf[sn]||{n:0,t:0}; stf[sn].n++; stf[sn].t+=+x.total||0;
    (x.items||[]).forEach(i=>{ svc[i.name]=svc[i.name]||{n:0,t:0}; svc[i.name].n+=+i.qty||1; svc[i.name].t+=(+i.price||0)*(+i.qty||1); });
  });
  return {bk, inv, cnt, pay, stf, svc, sum:r2(sum), vat:r2(vat), net:r2(net), disc:r2(disc)};
}

function checkClash(){
  const el=$("#bk-clash"); if(!el) return;

  if(!d||!t||!st){ el.textContent=""; return; }
  const c=S.bookings.find(b=>b.id!==id&&b.date===d&&b.time===t&&b.staffId===st&&b.status!=="cancelled"&&b.status!=="noshow");
  el.textContent = c ? `تنبيه: ${staffName(st)} عندها حجز ثاني بنفس الوقت (${c.clientName}).` : "";
}
const phoneId = p => { const d=String(p||"").replace(/\D/g,""); return d ? "c"+d : ""; };
async function upsertClient(name, phone){
  const id=phoneId(phone); if(!id) return "";
  const ex=byId(S.clients,id);
  if(!ex) await S.db.doc("clients/"+id).set({name, phone, createdAt:new Date().toISOString()});
  else if(ex.name!==name && name) await S.db.doc("clients/"+id).update({name});
  return id;
}
async function saveBooking(form){
  const id=form.dataset.id;
  const data={
    clientName:$("#bk-name").value.trim(), clientPhone:$("#bk-phone").value.trim(),
    date:$("#bk-date").value, time:$("#bk-time").value, staffId:$("#bk-staff").value,
    serviceIds:[...form.querySelectorAll("input[name=svc]:checked")].map(i=>i.value),
    notes:$("#bk-notes").value.trim()
  };
  if(!data.clientName||!data.date||!data.time){ toast("أكملي الاسم والتاريخ والوقت"); return; }
  try{
    data.clientId = await upsertClient(data.clientName, data.clientPhone);
    if(id){ if($("#bk-status")) data.status=$("#bk-status").value; await S.db.doc("bookings/"+id).update(data); toast("تم حفظ الحجز"); }
    else { data.status="booked"; data.createdAt=new Date().toISOString(); data.createdBy=S.me?.id||""; await S.db.collection("bookings").add(data); toast("تم تأكيد الحجز"); }
    closeModal();
  }catch(e){ dbErr(e); }
}

function syncDraft(){
  const d=invDraft; if(!d||!$("#invForm")) return;
  d.clientName=$("#iv-name").value; d.clientPhone=$("#iv-phone").value; d.staffId=$("#iv-staff").value; d.pay=$("#iv-pay").value;

  document.querySelectorAll("[data-it]").forEach(el=>{ const it=d.items[+el.dataset.i]; if(!it) return; const k=el.dataset.it; it[k]= k==="name"?el.value:(+el.value||0); });

async function saveInvoice(){
  syncDraft(); const d=invDraft;
  const items=d.items.filter(i=>i.name && (+i.qty||1)>0).map(i=>({name:i.name, qty:+i.qty||1, price:r2(i.price)}));
  if(!items.length){ toast("أضيفي بند واحد على الأقل"); return; }
  const T=calcTotals(items,d.discount,S.settings); const now=new Date();
  const number = `${String(now.getFullYear()).slice(2)}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${Math.random().toString(36).slice(2,4).toUpperCase()}`;
  try{
    const clientId = await upsertClient(d.clientName.trim(), d.clientPhone.trim());
    const ref = S.db.collection("invoices").doc();
    await ref.set({number, date:ymd(now), time:`${pad(now.getHours())}:${pad(now.getMinutes())}`, createdAt:now.toISOString(),
      bookingId:d.bookingId, clientId, clientName:d.clientName.trim(), clientPhone:d.clientPhone.trim(), staffId:d.staffId,
      items, discount:T.discount, net:T.net, vat:T.vat, total:T.total, pay:d.pay,
      vatEnabled:!!S.settings.vatEnabled, pricesIncludeVat:!!S.settings.pricesIncludeVat, void:false, createdBy:S.me?.id||""});
    if(d.bookingId) await S.db.doc("bookings/"+d.bookingId).update({status:"done", invoiceId:ref.id});
    toast("تم حفظ الفاتورة"); invDraft=null; viewInvoice(ref.id, true);
  }catch(e){ dbErr(e); }
}

async function findInvoice(id){
  let x = byId(S.invoices,id); if(x) return x;
  for(const k in S.extra){ x=byId(S.extra[k].invoices||[],id); if(x) return x; }
  try{ const s=await S.db.doc("invoices/"+id).get(); if(s.exists) return {id:s.id,...s.data()}; }catch(e){}
  return null;
}

  const x = await findInvoice(id); if(!x){ toast("ما لقيت الفاتورة"); return; }
  openModal(mh("الفاتورة") + receiptHtml(x) + `${x.createdBy&&staffName(x.createdBy)?`<div class="small muted" style="margin-top:8px">أصدرتها: ${esc(staffName(x.createdBy))}</div>`:""}<div class="mf">
    ${S.downloads?`<button class="btn primary" type="button" data-dlinv="${x.id}">تنزيل الفاتورة</button>`:""}
    <button class="btn" type="button" data-cpinv="${x.id}">نسخ كنص</button>
    ${S.canWrite&&!x.void&&isAdmin()?`<button class="btn danger" type="button" id="voidAsk">إلغاء الفاتورة</button>`:""}
  </div><div id="voidBox" data-id="${x.id}"></div>`);
}
function invoiceText(x){
  const L=[S.settings.name||"الصالون", S.settings.vatNo?`الرقم الضريبي: ${S.settings.vatNo}`:"", `فاتورة رقم ${x.number}`, `${x.date} ${x.time||""}`, x.clientName?`العميلة: ${x.clientName}`:"", ""];
  (x.items||[]).forEach(i=>L.push(`${i.name} × ${i.qty} = ${money(i.price*i.qty)}`));
  L.push("", x.discount?`الخصم: ${money(x.discount)}`:"", x.vatEnabled?`قبل الضريبة: ${money(x.net)}\nالضريبة 15%: ${money(x.vat)}`:"", `الإجمالي: ${money(x.total)} ر.س`, `الدفع: ${PAY[x.pay]||""}`);
  return L.filter(l=>l!=="").join("\n");
}
async function downloadInvoice(id){
  const x=await findInvoice(id); if(!x||!S.downloads) return;
  const css=`body{font-family:Tahoma,Arial,sans-serif;max-width:420px;margin:20px auto;color:#222;padding:0 12px}.rh{text-align:center;border-bottom:1px dashed #bbb;padding-bottom:10px;margin-bottom:10px}.nm{font-size:22px;font-weight:700;color:#8a2d5c}.kv,.totals div{display:flex;justify-content:space-between;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}th,td{padding:5px 3px;border-bottom:1px solid #eee;text-align:right}.n{text-align:left}.totals{border-top:1px dashed #bbb;margin-top:10px;padding-top:8px}.grand{font-weight:700;font-size:16px}.small{font-size:12px;color:#666}.muted{color:#666}.num{direction:ltr;unicode-bidi:isolate}.notice{color:#b23a3a}`;
  const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${esc(x.number)}</title><style>${css}</style></head><body>${receiptHtml(x)}</body></html>`;

/* in-memory store with the same calls as the db capability, used by the demo */
function makeMemDb(){
  const store={}, listeners=new Set(); let seq=0;
  const col=p=>store[p]||(store[p]=new Map());
  const uid=()=>"m"+Date.now().toString(36)+(seq++).toString(36);
  const clone=d=>JSON.parse(JSON.stringify(d));
  const ok=(d,fs)=>fs.every(([f,op,v])=>{ const x=d[f]; return op==="=="?x===v: op===">="?x>=v: op==="<="?x<=v: op===">"?x>v: op==="<"?x<v: op==="!="?x!==v: true; });
  const qsnap=(c,fs)=>{ const ds=[...col(c)].filter(([,d])=>ok(d,fs)).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{}})); return {docs:ds,size:ds.length,empty:!ds.length}; };
  const notify=c=>listeners.forEach(l=>{ if(l.c===c) l.fire(); });
  function docRef(c,id){ return { id, path:c+"/"+id,
    get:async()=>{ const d=col(c).get(id); return {id,exists:!!d,data:()=>d}; },
    set:async d=>{ col(c).set(id,clone(d)); notify(c); },
    update:async d=>{ const o=col(c).get(id); if(!o) throw {code:"invalid_argument",message:"missing"}; col(c).set(id,{...o,...clone(d)}); notify(c); },
    delete:async()=>{ col(c).delete(id); notify(c); },
    onSnapshot(cb){ const l={c,fire:()=>{ const d=col(c).get(id); cb({id,exists:!!d,data:()=>d}); }}; listeners.add(l); setTimeout(l.fire,0); return ()=>listeners.delete(l); }
  }; }
  function query(c,fs=[]){ return { path:c,
    where:(f,op,v)=>query(c,[...fs,[f,op,v]]), orderBy:()=>query(c,fs), limit:()=>query(c,fs),
    get:async()=>qsnap(c,fs),
    onSnapshot(cb){ const l={c,fire:()=>cb(qsnap(c,fs))}; listeners.add(l); setTimeout(l.fire,0); return ()=>listeners.delete(l); },
    doc:id=>docRef(c,id||uid()),
    add:async d=>{ const r=docRef(c,uid()); await r.set(d); return r; }
  }; }
  return { collection:p=>query(p), doc:p=>{ const i=p.lastIndexOf("/"); return docRef(p.slice(0,i),p.slice(i+1)); } };
}
