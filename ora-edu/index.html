/* Layout: brand bar with specialty switch + role tabs; each role a working console; live "نبض المركز" feed on the side.
   The brand hue changes per specialty so each pitch feels made for that center. */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#EBEEF6; --line:#D9DDEA;
  --fg:#111427; --muted:#5B6280;
  --brand:#16337A; --brand-ink:#FFFFFF; --brand-soft:#DFE6FA; --spot:#E0A526;
  --good:#1D7A4C; --good-soft:#DDF2E6; --warn:#9A5B00; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E1C; --surface:#13182E; --surface-2:#1B2140; --line:#2A3158;
  --fg:#E8EAF6; --muted:#9CA3C6; --brand:#8EA6FF; --brand-ink:#0B0E1C; --brand-soft:#1F2A5C; --spot:#F2C35A;
  --good:#5CD39A; --good-soft:#123826; --warn:#F2B451; --warn-soft:#3A2A0E; --bad:#FF8577; --bad-soft:#3F1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E1C; --surface:#13182E; --surface-2:#1B2140; --line:#2A3158;
  --fg:#E8EAF6; --muted:#9CA3C6; --brand:#8EA6FF; --brand-ink:#0B0E1C; --brand-soft:#1F2A5C; --spot:#F2C35A;
  --good:#5CD39A; --good-soft:#123826; --warn:#F2B451; --warn-soft:#3A2A0E; --bad:#FF8577; --bad-soft:#3F1714; color-scheme:dark}
/* per-specialty brand hues (light + dark) */
:root[data-spec="qudrat"]{--brand:#0F5B57;--brand-soft:#D6EFEC;--spot:#E5893B}
:root[data-spec="skills"]{--brand:#3B2F7A;--brand-soft:#E4E0F7;--spot:#2BA3A0}
:root[data-spec="kids"]{--brand:#7A3B12;--brand-soft:#F7E4D6;--spot:#3E9C5A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-spec="qudrat"]{--brand:#5ED1C5;--brand-soft:#123B38}
  :root:not([data-theme="light"])[data-spec="skills"]{--brand:#ADA2FF;--brand-soft:#2A2458}
  :root:not([data-theme="light"])[data-spec="kids"]{--brand:#F3A86E;--brand-soft:#3D2414}}
:root[data-theme="dark"][data-spec="qudrat"]{--brand:#5ED1C5;--brand-soft:#123B38}
:root[data-theme="dark"][data-spec="skills"]{--brand:#ADA2FF;--brand-soft:#2A2458}
:root[data-theme="dark"][data-spec="kids"]{--brand:#F3A86E;--brand-soft:#3D2414}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--brand);color:var(--brand-ink);transition:background .3s}
header.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:11px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:0 0 auto}
.brand h1{margin:0;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.25}
.brand small{display:block;opacity:.8;font-size:12.5px}
.specbox{display:flex;align-items:center;gap:8px;font-size:13px}
.specbox select{background:transparent;color:var(--brand-ink);border:1px solid currentColor;border-radius:99px;padding:5px 12px;cursor:pointer}
.specbox select option{color:#111427;background:#fff}
.roles{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.role{flex:0 0 auto;background:transparent;border:0;color:var(--brand-ink);opacity:.72;padding:10px 14px 12px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.role[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
.role:focus-visible{outline:2px solid var(--brand-ink);outline-offset:-2px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--spot);color:#111427;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
main .wrap{padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:920px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.vhead h2{margin:0;font-family:var(--display);font-size:22px;text-wrap:balance}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-family:var(--display);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;margin-top:2px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.kpi.hero .l,.kpi.hero .h{color:var(--brand-ink);opacity:.82}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:0 0 auto;font-size:14px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--brand-soft);color:var(--brand)} .p-mute{background:var(--surface-2);color:var(--muted)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn:focus-visible,.field:focus-visible,.opt:focus-visible,.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea.field{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline .field{flex:1;min-width:140px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.good{background:var(--good)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.feed{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:920px){.feed{position:static;max-height:none}}
.ev{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.ev:first-of-type{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 auto;background:var(--spot)}
.ev .who{font-size:11.5px;color:var(--muted)}
.ev.new{animation:flash 1.6s ease}
@keyframes flash{from{background:var(--brand-soft)}to{background:transparent}}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:inline-grid;place-items:center;border:1px solid var(--line);min-width:132px;min-height:132px;color:#111427;font-weight:700}
.idcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ann{border-inline-start:3px solid var(--spot);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
.ann .t{font-weight:600}.ann .s{font-size:12.5px;color:var(--muted)}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.star{background:none;border:0;font-size:26px;cursor:pointer;color:var(--line);padding:0;line-height:1}
.star.on{color:#E8A317}
.opt{text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt.ltr{direction:ltr;text-align:left}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.progress{display:flex;gap:4px}.progress span{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}.progress span.on{background:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.big{font-family:var(--display);font-size:42px;font-weight:700;color:var(--brand);line-height:1}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.heat{display:grid;gap:4px;font-size:12px}
.heat .c{border-radius:6px;padding:6px 4px;text-align:center;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.review{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin:0}
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.report{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.report .head{background:var(--brand);color:var(--brand-ink);padding:14px 16px}
.report .body{padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
footer.f{text-align:center;color:var(--muted);font-size:12.5px;padding:0 16px 32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const NAMES_F=['نوف السلمي','ريما الجهني','شهد المطيري','لمى الحربي','أروى العتيبي','جود الرحيلي','هيا الصاعدي','منار الأحمدي','رهف الشريف','دانة البلوي','أمل الحربي','سارة الردادي','غادة المحمدي','ليان الجابري','مها اللهيبي','عهود السناني','بيان الأنصاري','ريم الصبحي','شيماء العنزي','أسيل الفايدي','العنود الحازمي','تهاني الخالدي','حنين البركاتي','وجدان العوفي'];

/* ---------------- state ---------------- */
let S;
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function build(spec){
  const P=SPECS[spec], r=rng(spec.length*97+13);
  const st={spec,P,role:S?S.role:'admin',clock:{h:15,m:48},log:[],seen:{},quiz:{i:0,ans:[],done:false},taking:null,
    classes:P.classes.map((c,i)=>({id:'c'+i,name:c[0],lvl:c[1],price:c[2],teacher:c[3],cap:[12,14,10][i],week:[6,3,5][i],weeks:8,today:i<2,
      start:[[16,0],[18,0],[17,0]][i],time:['4:00 م','6:00 م','5:00 م'][i],room:'قاعة '+(i+1)})),
    students:[],att:{},subs:[],anns:[],leads:[],payments:[],reenroll:[],reviews:P.reviews.map(x=>({who:x[0],text:x[1],stars:x[2],cls:'c'+x[3],pub:true,when:'خريجة'})),
    hw:P.hw.map((t,i)=>({id:'h'+i,cls:'c0',title:t,due:['الأحد 8 نوفمبر','الثلاثاء 10 نوفمبر'][i],max:10})),
    quizzes:[{id:'q1',cls:'c0',title:spec==='qudrat'?'محاكي كمي · نموذج ٤':spec==='lang'?'Quiz · Units 5–7':'اختبار قصير ١',open:true,min:spec==='qudrat'?12:8}],
    me:'S-1001', tMe:P.classes[0][3], tCls:'c0'};
  const names=spec==='kids'?NAMES_K:NAMES_F;
  const sizes=[10,9,7];
  let n=1001, k=0;
  st.classes.forEach((c,ci)=>{for(let j=0;j<sizes[ci];j++){
    const name=names[k++%names.length]; const fee=Math.round(c.price*(1+VAT));
    const base=.45+r()*.35, slope=.03+r()*.05;
    // history of 5 past quizzes, per-topic scores
    const hist=[...Array(5)].map((_,w)=>{const t={};P.topics.forEach((tp,ti)=>{t[tp]=Math.max(.15,Math.min(1,base+slope*w+(r()-.5)*.3-(ti===2?.12:0)))});return t});
    const tot=c.week*3;
    st.students.push({id:'S-'+(n++),name,cls:c.id,att:Math.round(tot*(.72+r()*.28)),tot,fee,paid:[1,1,.5,1,0,1][Math.floor(r()*6)]*fee|0,hist,
      parent:spec==='kids'?'والد/ة '+name:'ولي أمر '+name.split(' ')[0]});
  }});
  // demo student: decent but improvable
  const me=st.students[0]; me.att=me.tot-2; me.paid=Math.round(me.fee*.5);
  [['S-1006','3:41 م'],['S-1002','3:44 م'],['S-1009','3:46 م']].forEach(([id,t])=>st.att[id]={t,late:false,by:'QR'});
  st.subs.push({hw:'h0',stu:'S-1006',at:'أمس 9:12 م',grade:null},{hw:'h0',stu:'S-1002',at:'أمس 10:40 م',grade:null});
  st.anns=[{to:'all',title:'تم تحديث جدول الحصص للأسبوع القادم',body:'تقدرين تشوفين الجدول من بوابتك.',by:'الإدارة',at:'الأحد'},
           {to:'c0',title:spec==='qudrat'?'محاكي شامل يوم الخميس':'اختبار منتصف الدورة',body:'في نفس وقت الحصة.',by:st.tMe,at:'الثلاثاء'}];
  st.leads=[{name:spec==='kids'?'أم يوسف':'بشاير الزهراني',phone:'05xxxxxx31',level:P.levels[1][1],cls:'c'+P.levels[1][2],at:'أمس',done:false}];
  ROLES.forEach(x=>st.seen[x.id]=0);
  return st;
}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ini=n=>n.trim()[0];
const bal=s=>s.fee-s.paid;
const isToday=s=>cls(s.cls).today;
const absRate=s=>{const a=s.att+(isToday(s)&&S.att[s.id]?1:0);return s.tot?1-a/s.tot:0};
const attPct=s=>Math.round((1-absRate(s))*100);
const lastScore=s=>{const h=s.hist[s.hist.length-1];return Math.round(avg(Object.values(h))*100)};
const firstScore=s=>Math.round(avg(Object.values(s.hist[0]))*100);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const topicAvg=(list,tp)=>avg(list.map(s=>s.hist[s.hist.length-1][tp]));
const clockStr=()=>{const{h,m}=S.clock;return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'م':'ص')};
const tick=n=>{S.clock.m+=n;while(S.clock.m>=60){S.clock.m-=60;S.clock.h++}};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}

const scoreTone=v=>v>=.75?'p-good':v>=.55?'p-warn':'p-bad';
const heatBg=v=>v>=.75?'var(--good-soft)':v>=.55?'var(--warn-soft)':'var(--bad-soft)';

function checkIn(id,by){
  const s=stu(id); if(!s) return toast('الرقم غير موجود');
  const c=cls(s.cls); if(!c.today) return toast(`${s.name}: ما عندها حصة اليوم`);
  if(S.att[id]) return toast(`${s.name} محضّرة مسبقاً`);
  tick(2+Math.floor(Math.random()*3));
  const late=(S.clock.h*60+S.clock.m)>(c.start[0]*60+c.start[1]+10);

/* ---------------- charts ---------------- */
function lineChart(points,{w=520,h=170,labels}={}){
  const pad={l:34,r:12,t:12,b:24}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const x=i=>pad.l+(points.length>1?i*iw/(points.length-1):iw/2), y=v=>pad.t+ih-(v/100)*ih;
  const path=points.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=path+` L${x(points.length-1)},${pad.t+ih} L${x(0)},${pad.t+ih} Z`;
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const lab=(labels||points.map((_,i)=>i+1)).map((t,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${t}</text>`).join('');
  const last=points.length-1;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="منحنى التقدم">${grid}<path d="${area}" fill="var(--brand-soft)" opacity=".7"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${points.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===last?5:3}" fill="${i===last?'var(--spot)':'var(--brand)'}"/>`).join('')}<text x="${x(last)}" y="${y(points[last])-10}" text-anchor="middle" style="fill:var(--fg);font-weight:700;font-size:12px">${points[last]}</text>${lab}</svg>`;
}
function topicBars(h){
  return `<div class="topics">${S.P.topics.map(tp=>{const v=h[tp];return `<div class="topic"><span>${tp}</span><div class="bar"><i class="${v>=.75?'good':v>=.55?'warn':'bad'}" style="width:${Math.round(v*100)}%"></i></div><b class="num">${Math.round(v*100)}%</b></div>`}).join('')}</div>`;
}

function vTakeTick(){clearTimeout(S._tm);S._tm=setTimeout(()=>{if(!S.taking||S.role!=='student')return;if(Date.now()>=S.taking.end)return finishQuiz();const el=$('#tmr');if(el){const l=Math.max(0,S.taking.end-Date.now());el.textContent=Math.floor(l/60000)+':'+String(Math.floor(l%60000/1000)).padStart(2,'0')}vTakeTick()},1000)}
function finishQuiz(){
  const T=S.taking, q=S.quizzes.find(x=>x.id===T.qid), s=stu(S.me);
  const per={}; S.P.topics.forEach(t=>per[t]=[0,0]);
  S.P.quiz.forEach((it,i)=>{const tp=S.P.topics[it[3]];per[tp][1]++;if(T.ans[i]===it[2])per[tp][0]++});
  const score=S.P.quiz.filter((it,i)=>T.ans[i]===it[2]).length, total=S.P.quiz.length;
  const prev=s.hist[s.hist.length-1], h={};
  S.P.topics.forEach(tp=>h[tp]=per[tp][1]?per[tp][0]/per[tp][1]:prev[tp]);
  s.hist.push(h); q.res=q.res||{}; q.res[s.id]={score,total};
  S.taking=null; clearTimeout(S._tm);
  log(`<b>${esc(s.name)}</b> أنهت «${esc(q.title)}» · <span class="num">${score}/${total}</span>`,'بوابة الطالبة',['teacher','admin','parent']);
  toast(`درجتك ${score} من ${total} · انضافت لمنحنى تقدمك`);render();
}

    `<div class="card"><h3>احجزي مقعدك</h3><form class="form" id="leadF"><input class="field" id="lN" placeholder="الاسم" required><input class="field num" id="lP" placeholder="رقم الجوال" style="text-align:right" required><button class="btn">أرسلي طلب التسجيل</button></form></div>`}
    ${reviewsHTML('تجارب من سبقوك في هذي الدورة',c.id)}`;
    const f=$('#leadF');if(f)f.onsubmit=e=>{e.preventDefault();const nm=$('#lN').value.trim(),ph=$('#lP').value.trim();if(!nm||!ph)return;S.leads.unshift({name:nm,phone:ph,level:lv[1],cls:c.id,at:'الآن',done:false});Q.sent=true;log(`طلب تسجيل جديد: <b>${esc(nm)}</b> · ${esc(lv[1])}`,'صفحة الزوار',['reception','admin']);toast('تم إرسال الطلب');render()};
    return;
  }
  const it=P.quiz[Q.i];
  v.innerHTML=`<div class="vhead"><div><h2>${esc(P.testName)}</h2><p>${P.quiz.length} أسئلة، دقيقتين، وتطلع لك الدورة المناسبة</p></div><span class="pill p-info">سؤال <span class="num">${Q.i+1}/${P.quiz.length}</span></span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="progress">${P.quiz.map((_,i)=>`<span class="${i<=Q.i?'on':''}"></span>`).join('')}</div>
  <div style="font-size:18px;font-weight:600;${P.ltr?'direction:ltr;text-align:left':''}">${esc(it[0])}</div>
  ${it[1].map((o,i)=>`<button class="opt ${P.ltr?'ltr':''} ${Q.ans[Q.i]===i?'sel':''}" data-act="vpick" data-i="${i}">${esc(o)}</button>`).join('')}
  <div class="inline" style="justify-content:space-between"><button class="btn ghost" data-act="vprev" ${Q.i?'':'disabled'}>السابق</button><button class="btn" data-act="vnext" ${Q.ans[Q.i]==null?'disabled':''}>${Q.i===P.quiz.length-1?'اعرضي النتيجة':'التالي'}</button></div></div>
  ${reviewsHTML(S.spec==='kids'?'تجارب أولياء الأمور':'تجارب طالباتنا')}`;
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act, id=b.dataset.id;
  if(act==='checkin'){checkIn(id,'يدوي');render()}
  else if(act==='selfscan'){checkIn(S.me,'QR');render()}
  else if(act==='tcls'){S.tCls=id;render()}
  else if(act==='kind'){S.kind=b.dataset.k;render()}
  else if(act==='warn'){const s=stu(id);log(`إنذار غياب لـ <b>${esc(s.name)}</b> (${Math.round(absRate(s)*100)}%)`,'الإدارة',['student','parent','teacher']);toast('وصل الإنذار للطالبة وولي الأمر')}
  else if(act==='remind'){const s=stu(id);log(`تذكير سداد لـ <b>${esc(s.name)}</b> · <span class="num">${sar(bal(s))}</span>`,'الإدارة',['student','parent','reception']);toast('تم إرسال التذكير')}
  else if(act==='report'){toast('في النسخة الفعلية: تقرير PDF و Excel للحضور والأداء والمالية')}
  else if(act==='pub'||act==='unpub'){const r=S.reviews[+b.dataset.i];r.pub=act==='pub';log(r.pub?`نُشر تقييم ${esc(r.who)} في صفحة الزوار`:`أُخفي تقييم ${esc(r.who)}`,'الإدارة',['visitor']);render()}
  else if(act==='enroll'){const l=S.leads[+b.dataset.i],cid=$('#'+b.dataset.sel).value,c=cls(cid),nid='S-'+(1001+S.students.length);
    S.students.push({id:nid,name:l.name,cls:cid,att:0,tot:0,fee:Math.round(c.price*(1+VAT)),paid:0,hist:[Object.fromEntries(S.P.topics.map(t=>[t,.5]))],parent:'ولي أمر '+l.name});l.done=true;
    log(`تسجيل <b>${esc(l.name)}</b> في ${esc(c.name)} · رقمها ${nid} · فاتورة <span class="num">${sar(c.price*(1+VAT))}</span>`,'الاستقبال',['admin','teacher']);toast('تم التسجيل وإصدار الفاتورة');render()}
  else if(act==='grade'){const i=+b.dataset.i,g=$('#g'+i).value;if(g==='')return toast('اكتبي الدرجة');S.subs[i].grade=Math.max(0,Math.min(10,+g));const s=stu(S.subs[i].stu);log(`تصحيح واجب <b>${esc(s.name)}</b>: <span class="num">${S.subs[i].grade}/10</span>`,S.tMe,['student','parent']);toast('وصلت الدرجة للطالبة');render()}
  else if(act==='submit'){const h=S.hw.find(x=>x.id===id);S.subs.push({hw:id,stu:S.me,at:'الآن',grade:null});log(`<b>${esc(stu(S.me).name)}</b> سلّمت: ${esc(h.title)}`,'بوابة الطالبة',['teacher']);toast('وصل التسليم للمعلمة');render()}
  else if(act==='startq'){S.taking={qid:id,i:0,ans:[],end:Date.now()+(S.quizzes.find(q=>q.id===id).min*60000)};render()}
  else if(act==='qpick'){S.taking.ans[S.taking.i]=+b.dataset.i;render()}
  else if(act==='qnext'){if(S.taking.i<S.P.quiz.length-1){S.taking.i++;render()}else finishQuiz()}
  else if(act==='qprev'){S.taking.i=Math.max(0,S.taking.i-1);render()}
  else if(act==='reenroll'){const s=stu(S.me);S.reenroll.push(s.id);s.fee+=Math.round(cls(s.cls).price*(1+VAT));log(`<b>${esc(s.name)}</b> حجزت مقعد الدورة التالية`,'بوابة الطالبة',['admin','reception','parent']);toast('تم حجز مقعدك');render()}
  else if(act==='rate'){if(!S._stars)return toast('اختاري عدد النجوم');const s=stu(S.me),parts=s.name.split(' ');S.reviews.unshift({who:parts[0]+' '+(parts[1]?parts[1].replace(/^ال/,'')[0]+'.':''),text:$('#rateC').value.trim(),stars:S._stars,cls:s.cls,pub:false,me:true});log(`تقييم جديد ${'★'.repeat(S._stars)} من ${esc(s.name)} · بانتظار موافقة النشر`,'بوابة الطالبة',['admin']);S._stars=0;toast('شكراً لتقييمك');render()}
  else if(act==='vpick'){S.quiz.ans[S.quiz.i]=+b.dataset.i;render()}
  else if(act==='vnext'){if(S.quiz.i<S.P.quiz.length-1)S.quiz.i++;else S.quiz.done=true;render()}
  else if(act==='vprev'){S.quiz.i=Math.max(0,S.quiz.i-1);render()}
  else if(act==='qreset'){S.quiz={i:0,ans:[],done:false};render()}
});

/* ---------------- boot ---------------- */
let spec0='lang',role0='admin';
try{const s=localStorage.getItem('ora-edu-spec');if(SPECS[s])spec0=s;const r=localStorage.getItem('ora-edu-role');if(ROLES.some(x=>x.id===r))role0=r}catch(e){}
try{const h=location.hash.slice(1);if(SPECS[h])spec0=h}catch(e){}
S=null; setSpec(spec0); go(role0);
</script>

</body>
</html>
