<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>عرض ReemaMatcha</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Presentation shell: one link holds the customer page and the admin screen, sharing orders live. */
:root{--navy:#1b2a5c;--blue:#a6bccd;--sky:#e9f0f5;--muted:#6c7896}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--navy);font-family:"Readex Pro",Tahoma,sans-serif;overflow:hidden}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid #dfe7ee;background:#fff;position:relative}
.top:after{content:"";position:absolute;inset:auto 0 -1px 0;height:4px;background:repeating-linear-gradient(90deg,var(--blue) 0 10px,#fff 10px 16px)}
.top .t{font-size:12px;color:var(--muted);line-height:1.3}
.top .t b{font-family:Pacifico,cursive;font-weight:400;font-size:19px;color:var(--navy);display:block;direction:ltr;text-align:right}
.seg{display:flex;border:1.5px solid #d4dde7;border-radius:999px;padding:3px;background:#fff}
.seg button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.25s;white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.stage{height:calc(100% - 58px)}
.frame{height:100%}
iframe{border:0;width:100%;height:100%;display:block;background:#fbfaf2}
.pane{height:100%;min-height:0}
.pane.hide{display:none}
.cap{display:none}
@media (min-width:1000px){
  .seg{display:none}
  .stage{display:grid;grid-template-columns:440px 1fr;grid-template-rows:100%}
  .pane.hide{display:block}
  .phone{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border-left:1px solid #dfe7ee;
    background:repeating-linear-gradient(90deg,#c9d7e2 0 14px,#fff 14px 24px)}
  .phone .frame{width:390px;height:min(800px,calc(100% - 44px));border:1px solid #b9c7d4;border-radius:38px;overflow:hidden;box-shadow:0 30px 70px rgba(27,42,92,.25),0 0 0 6px #fff}
  .cap{display:block;font-size:12px;color:var(--navy);margin-top:12px;background:#fff;padding:4px 12px;border-radius:20px}
}
</style>
</head>
<body>
<div class="top">
  <div class="t"><b>ReemaMatcha</b>نموذج مقترح · نرجس العمري</div>
  <div class="seg" role="tablist">
    <button class="on" type="button" data-p="phone" role="tab">صفحة الزبون</button>
    <button type="button" data-p="admin" role="tab">لوحة الإدارة</button>
  </div>
</div>
<div class="stage">
  <div class="pane phone" id="phone"><div class="frame"><iframe title="صفحة الزبون" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;
&lt;head&gt;
&lt;script&gt;window.MODE=&quot;customer&quot;&lt;/script&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;ReemaMatcha — ماتشا يابانية احتفالية فاخرة&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{--navy:#1b2a5c;--blue:#a6bccd;--blue2:#c9d7e2;--sky:#e9f0f5;--cream:#fbfaf2;--coral:#e0896b;--ink:#25305a;--muted:#6c7896;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:&quot;Readex Pro&quot;,system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.script{font-family:Pacifico,cursive;color:var(--navy);direction:ltr;unicode-bidi:isolate}
.stripes{background:repeating-linear-gradient(90deg,var(--blue) 0 14px,#fff 14px 22px,var(--blue) 22px 26px,#fff 26px 40px)}
.dots{background-color:#fff;background-image:radial-gradient(#c3cbd8 1px,transparent 1.2px);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea,select{font-family:inherit}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
#intro .stripes{position:absolute;inset:0;transform-origin:top;animation:curtain 1.2s cubic-bezier(.6,0,.2,1) both}
@keyframes curtain{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#intro .hang{position:relative;width:min(300px,70vw);transform-origin:50% 0;animation:drop 1.4s .9s cubic-bezier(.3,1.6,.5,1) both, swing 3.2s 2.3s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-120vh) rotate(-14deg)}to{transform:translateY(0) rotate(0)}}
@keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
#intro .logo-word{opacity:0;animation:fade .8s 2.1s both}
#intro .star{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
#intro .star.s1{animation-delay:2.6s}#intro .star.s2{animation-delay:2.8s}#intro .star.s3{animation-delay:3s}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#intro .tag{position:relative;margin-top:26px;background:#fff;color:var(--navy);padding:10px 22px;border-radius:40px;font-weight:600;font-size:15px;box-shadow:0 8px 24px #1b2a5c22;opacity:0;animation:fade .8s 3.2s both}
#intro .enter{position:relative;margin-top:18px;background:var(--navy);color:#fff;padding:14px 34px;border-radius:40px;font-size:16px;font-weight:600;opacity:0;animation:fade .8s 3.6s both;box-shadow:0 10px 30px #1b2a5c44}
#intro .sparkle{position:absolute;width:16px;height:16px;opacity:0;animation:twinkle 2.4s infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(60deg)}}
#intro.out{clip-path:circle(0% at 50% 50%)}
#intro{clip-path:circle(150% at 50% 50%)}

/* ---------- LAYOUT ---------- */
header{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid #e6ebf1}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand svg{width:40px}
.brand .script{font-size:22px}
nav{display:flex;gap:6px}
nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:30px}
nav a:hover{background:var(--sky);color:var(--navy)}
.cartbtn{position:relative;background:var(--navy);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cartbtn b{position:absolute;top:-4px;left:-4px;background:var(--coral);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;transform:scale(0);transition:.3s}
.cartbtn b.on{transform:scale(1)}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
@media(max-width:720px){nav{display:none}}

.hero{position:relative;overflow:hidden}
.hero .stripes{position:absolute;inset:0;opacity:.95}
.hero-in{position:relative;max-width:1100px;margin:auto;padding:60px 18px 70px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero-card{background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 20px 50px #1b2a5c1f}
.eyebrow{display:inline-flex;gap:6px;align-items:center;background:var(--sky);color:var(--navy);font-size:13px;padding:6px 14px;border-radius:30px;font-weight:500}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.35;margin:16px 0 12px;color:var(--navy);font-weight:700}
.hero h1 .script{font-size:1.05em;font-weight:400}
.hero p{color:var(--muted);line-height:1.9;font-size:15.5px}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--navy);color:#fff;padding:13px 26px;border-radius:40px;font-size:15px;font-weight:600;text-decoration:none;display:inline-flex;gap:8px;align-items:center;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #1b2a5c33}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--blue)}
.hero-art{position:relative;display:grid;place-items:center}
.hero-art .hang{width:min(320px,80%);transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;padding:30px 16px 40px}.hero-art{order:-1}.hero-art .hang{width:200px}}

section{padding:64px 0}
.sec-h{text-align:center;margin-bottom:34px}
.sec-h h2{font-size:28px;color:var(--navy);margin-top:10px}
.sec-h p{color:var(--muted);margin-top:8px;font-size:15px}
.mini-stars{display:inline-flex;gap:6px}
.mini-stars svg{width:18px}

/* products */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid #e3e9f0;transition:.35s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px #1b2a5c1c}
.card .img{aspect-ratio:1;background:#f3f6f9;position:relative;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover .img img{transform:scale(1.05)}
.badge{position:absolute;top:14px;right:14px;background:var(--navy);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px}
.badge.c{background:var(--coral)}
.card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:18px;color:var(--navy)}
.card .desc{font-size:13.5px;color:var(--muted);line-height:1.8;flex:1}
.price{font-size:20px;font-weight:700;color:var(--navy)}
.price small{font-size:12px;font-weight:400;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.add{background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;font-weight:600;transition:.2s}
.add:active{transform:scale(.94)}
.gift-art{display:grid;place-items:center;height:100%;background:repeating-linear-gradient(90deg,var(--blue2) 0 10px,#fff 10px 20px)}
.gift-art .box{width:62%;position:relative}

/* tag studio */
.studio{background:var(--sky);border-radius:32px;padding:40px 30px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden}
@media(max-width:820px){.studio{grid-template-columns:1fr;padding:26px 18px}}
.studio h2{color:var(--navy);font-size:26px;margin:10px 0}
.studio p{color:var(--muted);line-height:1.9;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--navy);font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid #d4dde7;border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;color:var(--ink);outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #d4dde7;color:var(--navy);padding:8px 14px;border-radius:30px;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.studio-prev{display:grid;place-items:center;min-height:330px;position:relative}
.studio-prev .hang{width:min(290px,80%);transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}

/* ritual */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr}}
.step{background:#fff;border-radius:var(--r);padding:22px 18px;border:1px solid #e3e9f0;text-align:center;position:relative}
.step .n{width:44px;height:44px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-weight:700;font-size:18px}
.step h4{color:var(--navy);font-size:16px;margin-bottom:6px}
.step p{color:var(--muted);font-size:13px;line-height:1.8}


/* whisk game */
.game{background:#fff;border-radius:32px;border:1px solid #e3e9f0;padding:30px 22px;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;position:relative;overflow:hidden}
@media(max-width:820px){.game{grid-template-columns:1fr;padding:24px 16px}}
.game h2{color:var(--navy);font-size:26px;margin:10px 0}
.game p{color:var(--muted);line-height:1.9;font-size:15px}
.bowlwrap{position:relative;width:min(340px,92%);margin:auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#bowlSvg{width:100%;height:100%;display:block}
.bowlwrap.shake{animation:wob .25s}
@keyframes wob{50%{transform:rotate(1.2deg) scale(1.01)}}
.whisk{position:absolute;width:74px;height:74px;pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
.whisk.on{opacity:1}
.hint{position:absolute;inset:auto 0 6px 0;text-align:center;font-size:13px;color:var(--navy);font-weight:600;pointer-events:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.meter{margin-top:18px}
.meter .stars{display:flex;gap:14px;justify-content:center;margin-bottom:10px}
.meter .stars svg{width:38px;height:38px;overflow:visible;filter:grayscale(1) opacity(.35);transition:.4s cubic-bezier(.3,1.8,.5,1)}
.meter .stars svg.lit{filter:none;transform:scale(1.25) rotate(30deg)}
.bar2{height:10px;background:var(--sky);border-radius:10px;margin-top:14px;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fa83b,#b9d77a);border-radius:10px;transition:width .15s}
.lvl{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
.coupon{margin-top:18px;border:2px dashed var(--blue);border-radius:20px;padding:18px;text-align:center;background:var(--sky);display:none}
.coupon.on{display:block;animation:fade .6s both}
.coupon .code{font-family:monospace;font-size:24px;letter-spacing:3px;color:var(--navy);font-weight:700;background:#fff;display:inline-block;padding:6px 18px;border-radius:12px;margin:8px 0}
.burst{position:absolute;width:22px;pointer-events:none;z-index:5;animation:burst 1.1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(220deg);opacity:0}}


.otabs{display:flex;gap:6px;background:#ffffff14;padding:5px;border-radius:16px;margin:20px 0 16px;width:fit-content;max-width:100%;overflow:auto}
.otabs button{background:none;color:#ffffffb0;padding:9px 16px;border-radius:12px;font-size:14px;white-space:nowrap}
.otabs button.on{background:#fff;color:var(--navy);font-weight:600}
.opanel{display:none}.opanel.on{display:block;animation:fade .4s both}
.msum{background:#fff;color:var(--ink);border-radius:24px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 6px}
.mhead h3{font-size:20px;color:var(--navy)}
.mhead small{font-size:12px;color:var(--muted)}
.mmonth{font-size:14px;color:var(--muted)}
.mseg{display:flex;gap:6px;padding:8px 20px 4px}
.mseg button{background:var(--sky);color:var(--navy);font-size:13px;padding:7px 14px;border-radius:20px}
.mseg button.on{background:var(--navy);color:#fff}
.chart{position:relative;margin:10px 14px 0;background:#f6f9fb;border-radius:18px;padding:16px 10px 8px}
.chart svg{width:100%;height:210px;display:block;overflow:visible}
.chart .bar{fill:var(--navy);transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;transition:fill .2s}
.chart .bar:hover,.chart .bar.sel{fill:var(--coral)}
.chart .bar.today{fill:#7fa83b}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.xl{position:relative;height:22px;font-size:11.5px;color:var(--muted);direction:ltr}
.xl span{position:absolute;transform:translateX(-50%);top:4px}
.tip{position:absolute;z-index:2;background:var(--navy);color:#fff;font-size:12px;padding:7px 11px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;transform:translate(-50%,-110%)}
.tip.on{opacity:1}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:18px 20px 6px}
.mki{display:flex;align-items:center;gap:12px;padding:12px 0}
.mki .ic{width:56px;height:56px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;flex-shrink:0}
.mki .ic svg{width:26px;height:26px}
.mki b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.mki span{font-size:13px;color:var(--muted)}
.ring{position:relative;width:56px;height:56px;flex-shrink:0}
.ring svg{width:56px;height:56px}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;color:var(--navy)}
.edit{color:var(--coral);font-size:11.5px;cursor:pointer;margin-right:4px}
.mextra{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #eef2f6;margin-top:6px}
.mextra div{padding:14px 12px;text-align:center;border-left:1px solid #eef2f6}
.mextra div:last-child{border-left:0}
.mextra span{display:block;font-size:11.5px;color:var(--muted)}
.mextra b{display:block;font-size:15px;color:var(--navy);margin-top:4px}
@media(max-width:600px){.mextra{grid-template-columns:1fr 1fr}.mextra div:nth-child(2){border-left:0}.mextra div:nth-child(-n+2){border-bottom:1px solid #eef2f6}.mk{grid-template-columns:1fr}.mki b{font-size:20px}}
.gmodal{position:fixed;inset:0;z-index:80;background:#1b2a5c66;display:grid;place-items:center;padding:20px}
.gmodal .box{background:#fff;border-radius:22px;padding:22px;width:min(340px,100%)}


/* modes */
.m-customer #owner,.m-customer nav a[href=&quot;#owner&quot;]{display:none}
.m-admin #intro,.m-admin .hero,.m-admin #shop,.m-admin #whisk,.m-admin #tag,.m-admin #ritual,.m-admin nav,.m-admin .cartbtn,.m-admin .drawer,.m-admin .scrim{display:none!important}
.m-admin body{background:var(--sky)}
.m-admin #owner{padding:22px 0}
.m-admin .owner .reveal,.m-admin .reveal{opacity:1;transform:none}


.wcard{background:#fff;color:var(--ink);border-radius:22px;padding:18px}
.whead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.whead h3{color:var(--navy);font-size:18px}
.whead small{font-size:12.5px;color:var(--muted)}
.btn.sm{padding:9px 16px;font-size:13px}
.txr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid #eef2f6;flex-wrap:wrap}
.txr:first-child{border-top:0}
.txi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:#e3f3e8;color:#2c7a4b}
.txi.out{background:#f3e3df;color:#b4553a}.txi.pend{background:#fdf1d8;color:#a8740e}
.txm{flex:1;min-width:150px;font-size:13px;color:var(--muted);line-height:1.6}
.txm b{color:var(--ink);font-size:14px}
.amt{font-weight:700;font-size:16px;color:#2c7a4b;white-space:nowrap}
.amt.out{color:#b4553a}.amt.pend{color:#a8740e}
.lnk{background:var(--sky);color:var(--navy);font-size:12px;padding:6px 12px;border-radius:16px;font-weight:600}
.lnk.ok{background:#2c7a4b;color:#fff}
.pill.pend{background:#fdf1d8;color:#a8740e}.pill.out{background:#f3e3df;color:#b4553a}.pill.live{background:var(--coral);color:#fff}
.crow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid #eef2f6;flex-wrap:wrap}
.crow:first-child{border-top:0}
.ccode{font-family:monospace;font-weight:700;font-size:15px;letter-spacing:1.5px;color:var(--navy);background:var(--sky);border:1.5px dashed var(--blue);padding:6px 12px;border-radius:10px}
.cinfo{flex:1;min-width:150px;font-size:13px;color:var(--muted);line-height:1.6}
.cinfo b{color:var(--ink)}
.ubar{height:6px;background:#eef2f6;border-radius:6px;margin-top:5px;overflow:hidden;max-width:220px}
.ubar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.switch2{width:44px;height:26px;border-radius:20px;background:#d4dde7;position:relative;transition:.3s;flex-shrink:0}
.switch2:after{content:&quot;&quot;;position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 1px 3px #0003}
.switch2.on{background:#2c7a4b}.switch2.on:after{right:21px}
.del{background:none;color:#b4553a;font-size:12px}
.addf{margin-top:14px;background:var(--sky);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.addf b{color:var(--navy);font-size:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.addf input,.addf select{border:1.5px solid #d4dde7;border-radius:12px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);min-width:0}
.addf .btn{align-self:flex-start}
.hintline{font-size:12.5px;color:var(--muted);background:var(--sky);padding:10px 12px;border-radius:12px;margin-top:10px;line-height:1.7}
.nudge{background:#fff;border:1.5px dashed var(--blue);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--navy);margin-bottom:10px}
.nudge .bar2{margin-top:8px;height:7px}
.nudge.won{border-style:solid;border-color:#9fd3b2;background:#eef8f1;color:#2c7a4b}
.cpn{display:flex;gap:8px}
.cpn input{flex:1;border:1.5px solid #d4dde7;border-radius:12px;padding:10px 12px;font-size:14px;text-transform:uppercase;min-width:0}
.cpn button{background:var(--sky);color:var(--navy);border-radius:12px;padding:0 16px;font-weight:600;font-size:14px}
.cmsg{font-size:12px;margin-top:6px}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.paym button{background:#fff;border:1.5px solid #d4dde7;border-radius:12px;padding:10px 4px;font-size:13px;color:var(--navy)}
.paym button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.remind{position:fixed;top:-140px;right:12px;left:12px;z-index:95;background:#fff;border-radius:18px;box-shadow:0 18px 40px #1b2a5c33;padding:14px;display:flex;gap:12px;align-items:center;transition:top .6s cubic-bezier(.3,1.4,.5,1);border:1.5px solid var(--blue);max-width:460px;margin:auto}
.remind.on{top:12px}
.remind .rt{flex:1;font-size:13px;color:var(--muted);line-height:1.6}
.remind .rt b{color:var(--navy);font-size:14px;display:block}
.inv{color:var(--ink);font-size:13.5px}
.inv .ih{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:10px}
.inv table{width:100%;border-collapse:collapse;margin:8px 0}
.inv td,.inv th{padding:7px 4px;text-align:right;border-bottom:1px solid #eef2f6;font-size:13px}
.inv th{color:var(--muted);font-weight:500;font-size:12px}
.inv .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.inv .r.t{color:var(--navy);font-weight:700;font-size:16px;border-top:1px solid #dfe7ee;padding-top:8px;margin-top:4px}
.gmodal .box{max-height:90vh;overflow:auto}

/* cart drawer */
.scrim{position:fixed;inset:0;background:#1b2a5c55;z-index:50;opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:var(--cream);z-index:60;transform:translateX(-105%);transition:.45s cubic-bezier(.6,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .top{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e9f0;background:#fff}
.drawer .top h3{color:var(--navy)}
.x{background:var(--sky);color:var(--navy);width:38px;height:38px;border-radius:50%;font-size:18px}
.drawer .content{flex:1;overflow:auto;padding:16px 18px}
.drawer .foot{padding:16px 18px;border-top:1px solid #e3e9f0;background:#fff}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;border:1px solid #e8edf3}
.item img,.item .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--sky)}
.item .meta{flex:1}
.item .meta b{display:block;color:var(--navy);font-size:14px}
.item .meta span{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--navy);font-size:16px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty svg{width:110px;margin-bottom:12px;opacity:.7}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:4px 0}
.sum.t{font-size:17px;color:var(--navy);font-weight:700;margin-top:8px}
.full{width:100%;justify-content:center;margin-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1.5px solid #d4dde7;border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:10px;background:none;color:var(--muted);font-size:14px}
.seg button.on{background:var(--navy);color:#fff}

/* success */
.success{text-align:center;padding:10px 0}
.success .hang{width:150px;margin:0 auto;animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
.success h3{color:var(--navy);margin:14px 0 6px}
.track{display:flex;justify-content:space-between;margin:22px 4px 6px;position:relative}
.track:before{content:&quot;&quot;;position:absolute;top:15px;right:8%;left:8%;height:3px;background:#dbe3ec}
.track .t{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);width:25%}
.track .t i{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #dbe3ec;display:grid;place-items:center;font-style:normal;font-size:13px;transition:.4s}
.track .t.on i{background:var(--navy);border-color:var(--navy);color:#fff}
.track .t.on{color:var(--navy);font-weight:600}

/* owner */
.owner{background:var(--navy);color:#fff;border-radius:32px;padding:34px 26px}
.owner h2{font-size:24px}
.owner .sub{opacity:.75;font-size:14px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#ffffff14;border-radius:18px;padding:14px}
.kpi span{font-size:12px;opacity:.75}
.kpi b{display:block;font-size:22px;margin-top:4px}
.orders{display:flex;flex-direction:column;gap:10px}
.ord{background:#fff;color:var(--ink);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ord .id{font-weight:700;color:var(--navy)}
.ord .info{flex:1;min-width:180px;font-size:13px;color:var(--muted);line-height:1.7}
.ord .info b{color:var(--ink)}
.pill{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--sky);color:var(--navy);font-weight:600}
.pill.done{background:#e3f3e8;color:#2c7a4b}
.adv{background:var(--coral);color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600}
.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
@media(max-width:720px){.stock{grid-template-columns:1fr}}
.stk{background:#ffffff14;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.switch{width:44px;height:26px;border-radius:20px;background:#ffffff40;position:relative;transition:.3s}
.switch:after{content:&quot;&quot;;position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s}
.switch.on{background:#7fc29a}.switch.on:after{right:21px}

footer{padding:40px 18px 30px;text-align:center;color:var(--muted);font-size:13px}
footer .script{font-size:26px}
footer a{color:var(--navy);font-weight:600;text-decoration:none}
.demo-note{display:inline-block;margin-top:12px;background:var(--sky);color:var(--navy);border-radius:20px;padding:6px 14px;font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;z-index:90;transition:.4s cubic-bezier(.3,1.5,.5,1);display:flex;gap:8px;align-items:center;box-shadow:0 14px 30px #1b2a5c44}
.toast.on{transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(24px);transition:.8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.fly{position:fixed;z-index:95;width:34px;pointer-events:none;transition:all .8s cubic-bezier(.5,-.3,.6,1)}

  const sel=$(&#x27;#noPid&#x27;);if(!sel.options.length)sel.innerHTML=products.map(p=&gt;`&lt;option value=&quot;${p.id}&quot;&gt;${p.name}&lt;/option&gt;`).join(&#x27;&#x27;)}

.meter{margin-top:18px}

.coupon.on{display:block;animation:fade .6s both}
.coupon .code{font-family:monospace;font-size:24px;letter-spacing:3px;color:var(--navy);font-weight:700;background:#fff;display:inline-block;padding:6px 18px;border-radius:12px;margin:8px 0}
.burst{position:absolute;width:22px;pointer-events:none;z-index:5;animation:burst 1.1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(220deg);opacity:0}}


.otabs{display:flex;gap:6px;background:#ffffff14;padding:5px;border-radius:16px;margin:20px 0 16px;width:fit-content;max-width:100%;overflow:auto}
.otabs button{background:none;color:#ffffffb0;padding:9px 16px;border-radius:12px;font-size:14px;white-space:nowrap}
.otabs button.on{background:#fff;color:var(--navy);font-weight:600}
.opanel{display:none}.opanel.on{display:block;animation:fade .4s both}
.msum{background:#fff;color:var(--ink);border-radius:24px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 6px}
.mhead h3{font-size:20px;color:var(--navy)}
.mhead small{font-size:12px;color:var(--muted)}

.chart{position:relative;margin:10px 14px 0;background:#f6f9fb;border-radius:18px;padding:16px 10px 8px}

.chart .bar:hover,.chart .bar.sel{fill:var(--coral)}
.chart .bar.today{fill:#7fa83b}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.xl{position:relative;height:22px;font-size:11.5px;color:var(--muted);direction:ltr}
.xl span{position:absolute;transform:translateX(-50%);top:4px}
.tip{position:absolute;z-index:2;background:var(--navy);color:#fff;font-size:12px;padding:7px 11px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;transform:translate(-50%,-110%)}
.tip.on{opacity:1}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:18px 20px 6px}
.mki{display:flex;align-items:center;gap:12px;padding:12px 0}
.mki .ic{width:56px;height:56px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;flex-shrink:0}
.mki .ic svg{width:26px;height:26px}

.ring{position:relative;width:56px;height:56px;flex-shrink:0}
.ring svg{width:56px;height:56px}

.edit{color:var(--coral);font-size:11.5px;cursor:pointer;margin-right:4px}
.mextra{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #eef2f6;margin-top:6px}
.mextra div{padding:14px 12px;text-align:center;border-left:1px solid #eef2f6}
.mextra div:last-child{border-left:0}

@media(max-width:600px){.mextra{grid-template-columns:1fr 1fr}.mextra div:nth-child(2){border-left:0}.mextra div:nth-child(-n+2){border-bottom:1px solid #eef2f6}.mk{grid-template-columns:1fr}.mki b{font-size:20px}}
.gmodal{position:fixed;inset:0;z-index:80;background:#1b2a5c66;display:grid;place-items:center;padding:20px}
.gmodal .box{background:#fff;border-radius:22px;padding:22px;width:min(340px,100%)}

.del{background:none;color:#b4553a;font-size:12px}
.addf{margin-top:14px;background:var(--sky);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

.remind{position:fixed;top:-140px;right:12px;left:12px;z-index:95;background:#fff;border-radius:18px;box-shadow:0 18px 40px #1b2a5c33;padding:14px;display:flex;gap:12px;align-items:center;transition:top .6s cubic-bezier(.3,1.4,.5,1);border:1.5px solid var(--blue);max-width:460px;margin:auto}

/* ---------- wallet ---------- */
let wFilter=&#x27;all&#x27;;
$(&#x27;#wFil&#x27;).onclick=e=&gt;{const b=e.target.closest(&#x27;.chip&#x27;);if(!b)return;document.querySelectorAll(&#x27;#wFil .chip&#x27;).forEach(c=&gt;c.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);wFilter=b.dataset.f;renderWallet()};
function renderWallet(){
  const inD=tx.filter(x=&gt;x.type===&#x27;in&#x27;&amp;&amp;x.status===&#x27;done&#x27;).reduce((a,x)=&gt;a+x.amount,0),out=tx.filter(x=&gt;x.type===&#x27;out&#x27;).reduce((a,x)=&gt;a+x.amount,0),pend=tx.filter(x=&gt;x.status===&#x27;pending&#x27;&amp;&amp;x.type===&#x27;in&#x27;).reduce((a,x)=&gt;a+x.amount,0);
  $(&#x27;#wBal&#x27;).textContent=money(inD-out)+&#x27; ر.س&#x27;;$(&#x27;#wPend&#x27;).textContent=money(pend)+&#x27; ر.س&#x27;;
  $(&#x27;#wIn&#x27;).textContent=money(BASE.sales+demoOrders().reduce((x,o)=&gt;x+o.total,0))+&#x27; ر.س&#x27;;$(&#x27;#wOut&#x27;).textContent=money(out)+&#x27; ر.س&#x27;;
  const L=tx.filter(x=&gt;wFilter===&#x27;all&#x27;||(wFilter===&#x27;pending&#x27;?x.status===&#x27;pending&#x27;:x.type===wFilter&amp;&amp;(x.type===&#x27;out&#x27;||x.status===&#x27;done&#x27;)));
  $(&#x27;#txList&#x27;).innerHTML=L.length?L.map(x=&gt;{const cls=x.type===&#x27;out&#x27;?&#x27;out&#x27;:x.status===&#x27;pending&#x27;?&#x27;pend&#x27;:&#x27;&#x27;;const ord=orders.find(o=&gt;o.id===x.ref);
    return `&lt;div class=&quot;txr&quot;&gt;&lt;div class=&quot;txi ${cls}&quot;&gt;${x.type===&#x27;out&#x27;?&#x27;↑&#x27;:x.status===&#x27;pending&#x27;?&#x27;⏳&#x27;:&#x27;↓&#x27;}&lt;/div&gt;&lt;div class=&quot;txm&quot;&gt;&lt;b&gt;${x.type===&#x27;out&#x27;?esc(x.who):&#x27;دفعة &#x27;+(x.ref!==&#x27;—&#x27;?&#x27;طلب &#x27;+x.ref:&#x27;&#x27;)+&#x27; · &#x27;+esc(x.who)}&lt;/b&gt;&lt;br&gt;${esc(x.method)} · ${x.time}${x.status===&#x27;pending&#x27;?&#x27; · &lt;span style=&quot;color:#a8740e&quot;&gt;&#x27;+(x.type===&#x27;out&#x27;?&#x27;جاري التحويل&#x27;:&#x27;بانتظار التأكيد&#x27;)+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;
    ${x.status===&#x27;pending&#x27;&amp;&amp;x.type===&#x27;in&#x27;?`&lt;button class=&quot;lnk ok&quot; onclick=&quot;confirmTx(&#x27;${x.id}&#x27;)&quot;&gt;تأكيد الاستلام&lt;/button&gt;`:&#x27;&#x27;}${ord?`&lt;button class=&quot;lnk&quot; onclick=&quot;invoice(&#x27;${ord.id}&#x27;)&quot;&gt;الفاتورة&lt;/button&gt;`:&#x27;&#x27;}&lt;div class=&quot;amt ${cls}&quot;&gt;${x.type===&#x27;out&#x27;?&#x27;−&#x27;:&#x27;+&#x27;}${money(x.amount)}&lt;/div&gt;&lt;/div&gt;`}).join(&#x27;&#x27;):`&lt;p style=&quot;color:var(--muted);text-align:center;padding:20px&quot;&gt;لا توجد حركات&lt;/p&gt;`;
}
function confirmTx(id){const x=tx.find(t=&gt;t.id===id);x.status=&#x27;done&#x27;;renderWallet();sync();toast(&#x27;💰 تم تأكيد استلام &#x27;+money(x.amount)+&#x27; ر.س&#x27;)}
function openModal(h){$(&#x27;#modalBox&#x27;).innerHTML=h;$(&#x27;#modal&#x27;).style.display=&#x27;grid&#x27;}
function closeModal(){$(&#x27;#modal&#x27;).style.display=&#x27;none&#x27;}
function withdraw(){const bal=tx.filter(x=&gt;x.type===&#x27;in&#x27;&amp;&amp;x.status===&#x27;done&#x27;).reduce((a,x)=&gt;a+x.amount,0)-tx.filter(x=&gt;x.type===&#x27;out&#x27;).reduce((a,x)=&gt;a+x.amount,0);
  openModal(`&lt;h3 style=&quot;color:var(--navy)&quot;&gt;سحب الرصيد&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13px;margin:6px 0 12px&quot;&gt;الرصيد المتاح: &lt;b style=&quot;color:var(--navy)&quot;&gt;${money(bal)} ر.س&lt;/b&gt;&lt;br&gt;يتحول للحساب البنكي المسجّل (آيبان ••••4417)&lt;/p&gt;&lt;div class=&quot;field&quot;&gt;&lt;input id=&quot;wAmt&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;${bal}&quot; value=&quot;${Math.floor(bal)}&quot;&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;&lt;button class=&quot;btn&quot; onclick=&quot;doWithdraw(${bal})&quot;&gt;تأكيد السحب&lt;/button&gt;&lt;button class=&quot;btn ghost&quot; onclick=&quot;closeModal()&quot;&gt;إلغاء&lt;/button&gt;&lt;/div&gt;`)}
function doWithdraw(bal){const v=+$(&#x27;#wAmt&#x27;).value;if(!(v&gt;0&amp;&amp;v&lt;=bal)){toast(&#x27;المبلغ غير صحيح&#x27;);return}tx.unshift({id:&#x27;TX-&#x27;+(5000+tx.length+1),type:&#x27;out&#x27;,amount:v,ref:&#x27;—&#x27;,who:&#x27;تحويل إلى الحساب البنكي&#x27;,method:&#x27;آيبان ••••4417&#x27;,time:&#x27;اليوم &#x27;+nowT(),status:&#x27;pending&#x27;});closeModal();renderWallet();sync();toast(&#x27;تم إرسال طلب السحب&#x27;)}
function invoice(id){const o=orders.find(x=&gt;x.id===id);if(!o)return;const sub=o.lines.reduce((a,l)=&gt;a+l.price*l.q,0);
  openModal(`&lt;div class=&quot;inv&quot;&gt;&lt;div class=&quot;ih&quot;&gt;&lt;div&gt;&lt;div class=&quot;script&quot; style=&quot;font-size:22px&quot;&gt;ReemaMatcha&lt;/div&gt;&lt;small style=&quot;color:var(--muted)&quot;&gt;فاتورة ضريبية مبسطة&lt;/small&gt;&lt;/div&gt;&lt;div style=&quot;text-align:left;font-size:12px;color:var(--muted)&quot;&gt;INV-${o.id.slice(3)}&lt;br&gt;${o.date||&#x27;&#x27;} · ${o.time}&lt;/div&gt;&lt;/div&gt;
  &lt;div style=&quot;font-size:13px;color:var(--muted)&quot;&gt;العميل: &lt;b style=&quot;color:var(--ink)&quot;&gt;${esc(o.name)}&lt;/b&gt; · ${esc(o.phone||&#x27;&#x27;)}&lt;br&gt;الطلب: ${o.id} · ${esc(o.area)} · الدفع: ${esc(o.method||&#x27;—&#x27;)}&lt;/div&gt;
  &lt;table&gt;&lt;tr&gt;&lt;th&gt;المنتج&lt;/th&gt;&lt;th&gt;الكمية&lt;/th&gt;&lt;th&gt;السعر&lt;/th&gt;&lt;th&gt;المجموع&lt;/th&gt;&lt;/tr&gt;${o.lines.map(l=&gt;`&lt;tr&gt;&lt;td&gt;${esc(l.name)}&lt;/td&gt;&lt;td&gt;${ar(l.q)}&lt;/td&gt;&lt;td&gt;${l.price?money(l.price):&#x27;هدية&#x27;}&lt;/td&gt;&lt;td&gt;${money(l.price*l.q)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/table&gt;
  &lt;div class=&quot;r&quot;&gt;&lt;span&gt;المجموع&lt;/span&gt;&lt;span&gt;${money(sub)}&lt;/span&gt;&lt;/div&gt;${(o.offs||[]).map(f=&gt;`&lt;div class=&quot;r&quot; style=&quot;color:#2c7a4b&quot;&gt;&lt;span&gt;عرض: ${f.n}&lt;/span&gt;&lt;span&gt;−${money(f.v)}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}${o.cd?`&lt;div class=&quot;r&quot; style=&quot;color:#2c7a4b&quot;&gt;&lt;span&gt;كوبون ${o.code}&lt;/span&gt;&lt;span&gt;−${money(o.cd)}&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;r&quot;&gt;&lt;span&gt;التوصيل&lt;/span&gt;&lt;span&gt;${money(o.d||0)}&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;r&quot;&gt;&lt;span&gt;منها ضريبة القيمة المضافة (١٥٪)&lt;/span&gt;&lt;span&gt;${money(Math.round(o.total*15/115*100)/100)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r t&quot;&gt;&lt;span&gt;الإجمالي&lt;/span&gt;&lt;span&gt;${money(o.total)} ر.س&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;cta&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button class=&quot;btn sm ghost&quot; onclick=&quot;closeModal()&quot;&gt;إغلاق&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`)}

/* ---------- coupons ---------- */
function renderCoupons(){$(&#x27;#couList&#x27;).innerHTML=coupons.map((c,i)=&gt;`&lt;div class=&quot;crow&quot;&gt;&lt;span class=&quot;ccode&quot;&gt;${esc(c.code)}&lt;/span&gt;&lt;div class=&quot;cinfo&quot;&gt;&lt;b&gt;${c.type===&#x27;pct&#x27;?&#x27;خصم &#x27;+ar(c.val)+&#x27;٪&#x27;:&#x27;خصم &#x27;+fmt(c.val)}&lt;/b&gt;${c.min?&#x27; · فوق &#x27;+fmt(c.min):&#x27; · بدون حد أدنى&#x27;}${c.note?&#x27; · &#x27;+esc(c.note):&#x27;&#x27;}&lt;br&gt;استُخدم ${ar(c.uses)}${c.limit?&#x27; من &#x27;+ar(c.limit):&#x27; مرة&#x27;}${c.limit?`&lt;div class=&quot;ubar&quot;&gt;&lt;i style=&quot;width:${Math.min(100,c.uses/c.limit*100)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;button class=&quot;switch2 ${c.active?&#x27;on&#x27;:&#x27;&#x27;}&quot; title=&quot;تفعيل/إيقاف&quot; onclick=&quot;coupons[${i}].active=!coupons[${i}].active;renderCoupons();sync()&quot;&gt;&lt;/button&gt;&lt;button class=&quot;del&quot; onclick=&quot;coupons.splice(${i},1);renderCoupons();sync()&quot;&gt;حذف&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
function addCoupon(e){e.preventDefault();const code=$(&#x27;#ncCode&#x27;).value.trim().toUpperCase().replace(/\s/g,&#x27;&#x27;);if(coupons.some(c=&gt;c.code===code)){toast(&#x27;الكود موجود&#x27;);return}
  coupons.unshift({code,type:$(&#x27;#ncType&#x27;).value,val:+$(&#x27;#ncVal&#x27;).value,min:+$(&#x27;#ncMin&#x27;).value||0,limit:+$(&#x27;#ncLim&#x27;).value||0,uses:0,active:true,note:&#x27;جديد&#x27;});e.target.reset();renderCoupons();sync();toast(&#x27;✦ تمت إضافة &#x27;+code+&#x27; — جرّبه في سلة الزبون&#x27;)}

/* ---------- cart offers ---------- */
function renderOffers(){$(&#x27;#offList&#x27;).innerHTML=offers.map((o,i)=&gt;`&lt;div class=&quot;crow&quot;&gt;&lt;span class=&quot;ccode&quot; style=&quot;font-family:inherit;letter-spacing:0&quot;&gt;${o.kind===&#x27;gift&#x27;?&#x27;🎁 هدية&#x27;:o.kind===&#x27;qty&#x27;?&#x27;🛍 كمية&#x27;:&#x27;٪ مبلغ&#x27;}&lt;/span&gt;&lt;div class=&quot;cinfo&quot;&gt;&lt;b&gt;${offerName(o)}&lt;/b&gt;&lt;br&gt;يطبّق تلقائياً في السلة&lt;/div&gt;&lt;button class=&quot;switch2 ${o.active?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;offers[${i}].active=!offers[${i}].active;renderOffers();sync()&quot;&gt;&lt;/button&gt;&lt;button class=&quot;del&quot; onclick=&quot;offers.splice(${i},1);renderOffers();sync()&quot;&gt;حذف&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;p style=&quot;color:var(--muted);padding:10px&quot;&gt;لا توجد عروض&lt;/p&gt;&#x27;;
  const sel=$(&#x27;#noPid&#x27;);if(!sel.options.length)sel.innerHTML=products.map(p=&gt;`&lt;option value=&quot;${p.id}&quot;&gt;${p.name}&lt;/option&gt;`).join(&#x27;&#x27;)}
function offFields(){const k=$(&#x27;#noKind&#x27;).value;$(&#x27;#noPid&#x27;).style.display=$(&#x27;#noQty&#x27;).style.display=k===&#x27;qty&#x27;?&#x27;&#x27;:&#x27;none&#x27;;$(&#x27;#noMin&#x27;).style.display=k===&#x27;qty&#x27;?&#x27;none&#x27;:&#x27;&#x27;;$(&#x27;#noPct&#x27;).style.display=k===&#x27;gift&#x27;?&#x27;none&#x27;:&#x27;&#x27;;$(&#x27;#noGift&#x27;).style.display=k===&#x27;gift&#x27;?&#x27;&#x27;:&#x27;none&#x27;}
function addOffer(e){e.preventDefault();const k=$(&#x27;#noKind&#x27;).value;const o={id:&#x27;of&#x27;+Date.now(),kind:k,active:true};
  if(k===&#x27;qty&#x27;){o.pid=$(&#x27;#noPid&#x27;).value;o.qty=+$(&#x27;#noQty&#x27;).value||2;o.pct=+$(&#x27;#noPct&#x27;).value}else{o.min=+$(&#x27;#noMin&#x27;).value;if(k===&#x27;gift&#x27;)o.gift=$(&#x27;#noGift&#x27;).value.trim();else o.pct=+$(&#x27;#noPct&#x27;).value}
  if((k!==&#x27;gift&#x27;&amp;&amp;!o.pct)||(k!==&#x27;qty&#x27;&amp;&amp;!o.min)||(k===&#x27;gift&#x27;&amp;&amp;!o.gift)){toast(&#x27;كمّل بيانات العرض&#x27;);return}
  offers.unshift(o);e.target.reset();offFields();renderOffers();sync();toast(&#x27;✦ العرض شغّال الحين في سلة الزبون&#x27;)}

/* ---------- abandoned carts ---------- */
const AST={new:[&#x27;لم يُذكَّر&#x27;,&#x27;&#x27;],sent:[&#x27;تم التذكير&#x27;,&#x27;pend&#x27;],recovered:[&#x27;رجع واشترى&#x27;,&#x27;done&#x27;]};
function renderAbandoned(){
  $(&#x27;#aAll&#x27;).textContent=ar(abandoned.length);$(&#x27;#aSent&#x27;).textContent=ar(abandoned.filter(a=&gt;a.status!==&#x27;new&#x27;).length);$(&#x27;#aRec&#x27;).textContent=ar(abandoned.filter(a=&gt;a.status===&#x27;recovered&#x27;).length);$(&#x27;#aVal&#x27;).textContent=fmt(abandoned.filter(a=&gt;a.status===&#x27;recovered&#x27;).reduce((x,a)=&gt;x+a.total,0));
  $(&#x27;#abnList&#x27;).innerHTML=abandoned.map(a=&gt;`&lt;div class=&quot;crow&quot;&gt;&lt;div class=&quot;txi ${a.status===&#x27;recovered&#x27;?&#x27;&#x27;:&#x27;pend&#x27;}&quot; style=&quot;${a.status===&#x27;new&#x27;?&#x27;background:var(--sky);color:var(--navy)&#x27;:&#x27;&#x27;}&quot;&gt;🛒&lt;/div&gt;&lt;div class=&quot;cinfo&quot;&gt;&lt;b&gt;${esc(a.name)}&lt;/b&gt; · ${esc(a.phone)} · ${a.when}&lt;br&gt;${esc(a.items)} — &lt;b&gt;${fmt(a.total)}&lt;/b&gt;${a.ref?&#x27; · طلب &#x27;+a.ref:&#x27;&#x27;}&lt;/div&gt;${a.live?&#x27;&lt;span class=&quot;pill live&quot;&gt;مباشر&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;span class=&quot;pill ${AST[a.status][1]}&quot;&gt;${AST[a.status][0]}&lt;/span&gt;${a.status===&#x27;new&#x27;?`&lt;button class=&quot;adv&quot; onclick=&quot;remind(&#x27;${a.id}&#x27;)&quot;&gt;أرسل تذكير&lt;/button&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;p style=&quot;color:var(--muted);padding:10px;text-align:center&quot;&gt;لا توجد سلات متروكة&lt;/p&gt;&#x27;}
function remind(id){const a=abandoned.find(x=&gt;x.id===id);if(!a)return;a.status=&#x27;sent&#x27;;renderAbandoned();sync(id===&#x27;AC-LIVE&#x27;);if(MODE===&#x27;full&#x27;&amp;&amp;id===&#x27;AC-LIVE&#x27;)setTimeout(showRemind,700);toast(&#x27;تم إرسال التذكير لـ&#x27;+a.name+&#x27; مع كود COMEBACK5&#x27;)}
function remindAll(){const live=abandoned.some(a=&gt;a.id===&#x27;AC-LIVE&#x27;&amp;&amp;a.status===&#x27;new&#x27;);abandoned.forEach(a=&gt;{if(a.status===&#x27;new&#x27;)a.status=&#x27;sent&#x27;});renderAbandoned();sync(live);if(MODE===&#x27;full&#x27;&amp;&amp;live)setTimeout(showRemind,700);toast(&#x27;تم تذكير كل السلات&#x27;)}
function showRemind(){const r=$(&#x27;#remind&#x27;);r.innerHTML=`&lt;div style=&quot;font-size:30px&quot;&gt;🛒&lt;/div&gt;&lt;div class=&quot;rt&quot;&gt;&lt;b&gt;سلتك تنتظرك ✦&lt;/b&gt;كمّل طلبك الحين واستخدم كود &lt;b style=&quot;display:inline&quot;&gt;COMEBACK5&lt;/b&gt; لخصم ٥٪&lt;/div&gt;&lt;button class=&quot;btn sm&quot; onclick=&quot;appliedCoupon=&#x27;COMEBACK5&#x27;;$(&#x27;#remind&#x27;).classList.remove(&#x27;on&#x27;);openCart()&quot;&gt;كمّل الطلب&lt;/button&gt;`;r.classList.add(&#x27;on&#x27;);setTimeout(()=&gt;r.classList.remove(&#x27;on&#x27;),12000)}

/* ---------- live sync between customer &amp; admin screens ---------- */
let bc=null;try{bc=new BroadcastChannel(&#x27;reema-demo&#x27;)}catch(_){}
function sync(remindLive){if(!bc)return;try{bc.postMessage({orders,avail,coupons,offers,abandoned,tx,remind:!!remindLive})}catch(_){}}
if(bc)bc.onmessage=e=&gt;{const d=e.data||{};if(!d.orders)return;
  const nw=d.orders.length&gt;orders.length;
  orders=d.orders;avail=d.avail;coupons=d.coupons;offers=d.offers;abandoned=d.abandoned;tx=d.tx;
  renderOwner();renderGrid();refreshTrack();
  if($(&#x27;#drawer&#x27;).classList.contains(&#x27;on&#x27;)&amp;&amp;$(&#x27;#dTitle&#x27;).textContent===&#x27;سلتك&#x27;)renderCart();
  if(MODE===&#x27;admin&#x27;&amp;&amp;nw){const t0=tx.find(x=&gt;x.ref===orders[0].id);toast(t0&amp;&amp;t0.status===&#x27;pending&#x27;?&#x27;🔔 طلب جديد &#x27;+orders[0].id+&#x27; — بانتظار التحويل &#x27;+money(orders[0].total)+&#x27; ر.س&#x27;:&#x27;💰 وصلك &#x27;+money(orders[0].total)+&#x27; ر.س — طلب &#x27;+orders[0].id)}
  if(MODE!==&#x27;admin&#x27;&amp;&amp;d.remind)showRemind()};
/* ---------- reveal ---------- */
const io=new IntersectionObserver(es=&gt;es.forEach(e=&gt;{if(e.isIntersecting){e.target.classList.add(&#x27;in&#x27;);io.unobserve(e.target)}}),{threshold:.12});
function init(){mountHearts();renderGrid();drawTag();seed();renderOwner();document.querySelectorAll(&#x27;.reveal&#x27;).forEach(el=&gt;io.observe(el))}
document.fonts&amp;&amp;document.fonts.ready.then(()=&gt;{}); init();
&lt;/script&gt;

<script>
function showPane(p){
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x.dataset.p===p));
  document.getElementById("phone").classList.toggle("hide",p!=="phone");
  document.getElementById("admin").classList.toggle("hide",p!=="admin");
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>showPane(b.dataset.p));
</script>
