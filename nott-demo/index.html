/* Presentation shell: one link holds the customer page and the admin screen, sharing orders live. */
:root{--night:#050404;--line:#2a241c;--ivory:#efe6d6;--muted:#8c8273;--amber:#e2ab6a;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ivory);font-family:var(--body);overflow:hidden}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0a0807}
.top .t{font-size:12px;color:var(--muted);line-height:1.4}
.top .t b{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.2em;color:var(--ivory);display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.25s;white-space:nowrap}
.seg button.on{background:var(--ivory);color:#0b0907}
.seg button:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.stage{height:calc(100% - 56px);display:block}
.frame{height:100%}
iframe{border:0;width:100%;height:100%;display:block;background:#080706}
.pane{height:100%;min-height:0}
.pane.hide{display:none}
.cap{display:none}

  .seg{display:none}
  .stage{display:grid;grid-template-columns:440px 1fr;grid-template-rows:100%;gap:0}
  .pane.hide{display:block}
  .phone{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border-left:1px solid var(--line);
    background:radial-gradient(ellipse at 50% 0%,rgba(226,171,106,.12),transparent 60%)}

  .cap{display:block;font-size:12px;color:var(--muted);margin-top:12px}
  .admin .cap{position:absolute}
}
</style>

&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;

&lt;style&gt;
/* Single dark world: a black room with one warm lamp. Narrow centered column, menu rows like the printed NOTT menu. */
:root{
  --night:#080706;
  --panel:#110f0c;
  --line:#2a241c;
  --ivory:#efe6d6;
  --muted:#8c8273;
  --amber:#e2ab6a;
  --amber-deep:#9a5a24;
  --display:&quot;Cormorant Garamond&quot;, &quot;Times New Roman&quot;, serif;
  --body:&quot;IBM Plex Sans Arabic&quot;, &quot;Segoe UI&quot;, Tahoma, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--ivory);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
a{color:inherit}
.latin{font-family:var(--display);letter-spacing:.18em;text-transform:uppercase}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity 1.1s ease, visibility 1.1s}
#intro.done{opacity:0;visibility:hidden}
.cord{position:absolute;top:0;left:50%;width:1px;height:0;background:linear-gradient(#000,#5b4a36);transform:translateX(-50%);animation:cord 1s .3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes cord{to{height:32vh}}
.bulb{position:absolute;top:32vh;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#2a2016;opacity:0;animation:bulbIn .2s 1.2s forwards, flicker 1.2s 1.4s forwards}
@keyframes bulbIn{to{opacity:1}}
@keyframes flicker{
  0%{background:#2a2016;box-shadow:none}
  12%{background:#ffd9a3;box-shadow:0 0 30px 8px #e2ab6a}
  18%{background:#2a2016;box-shadow:none}
  30%{background:#ffd9a3;box-shadow:0 0 40px 10px #e2ab6a}
  36%{background:#3a2a1a;box-shadow:0 0 6px #e2ab6a}
  55%,100%{background:#fff1da;box-shadow:0 0 50px 16px #e2ab6a,0 0 160px 60px rgba(226,171,106,.35)}
}
.halo{position:absolute;top:32vh;left:50%;width:10px;height:10px;transform:translate(-50%,-50%) scale(0);border-radius:50%;
  background:radial-gradient(circle,rgba(226,171,106,.38),rgba(154,90,36,.12) 40%,transparent 70%);animation:halo 2.4s 2.1s ease-out forwards}
@keyframes halo{to{transform:translate(-50%,-50%) scale(140)}}
.intro-word{position:relative;margin-top:22vh;text-align:center}
.intro-word .mark{font-family:var(--display);font-weight:400;font-size:clamp(54px,15vw,110px);letter-spacing:.9em;padding-inline-start:.9em;color:var(--ivory);opacity:0;filter:blur(10px);animation:mark 1.6s 2.5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes mark{to{opacity:1;filter:blur(0);letter-spacing:.22em;padding-inline-start:.22em}}
.intro-word .il{font-family:var(--display);letter-spacing:.42em;font-size:13px;color:var(--amber);margin-top:14px;opacity:0;animation:fade .9s forwards}
.intro-word .l1{animation-delay:3.4s}.intro-word .l2{animation-delay:3.9s;color:var(--muted)}
@keyframes fade{to{opacity:1}}
#skip{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);padding:8px 18px;border:1px solid #241e17;border-radius:999px}

/* ---------- HERO ---------- */
.demo-strip{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);background:#0c0a08}
.hero{position:relative;padding:72px 20px 56px;text-align:center;overflow:hidden;isolation:isolate}
#dust{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::before{content:&quot;&quot;;position:absolute;z-index:-2;top:-40px;left:50%;width:560px;height:520px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 0%,rgba(226,171,106,.30),rgba(154,90,36,.10) 45%,transparent 70%)}
.lamp{width:1px;height:46px;background:linear-gradient(transparent,#5b4a36);margin:-72px auto 0}
.lamp::after{content:&quot;&quot;;display:block;width:10px;height:10px;border-radius:50%;margin:46px 0 0 -4.5px;background:#fff1da;box-shadow:0 0 30px 10px rgba(226,171,106,.8),0 0 120px 40px rgba(226,171,106,.25);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 22px 7px rgba(226,171,106,.65),0 0 100px 30px rgba(226,171,106,.18)}}
.wordmark{font-family:var(--display);font-weight:400;font-size:clamp(56px,16vw,96px);letter-spacing:.22em;padding-inline-start:.22em;margin-top:30px;line-height:1;position:relative;display:inline-block}
.wordmark sup{font-size:.14em;position:absolute;top:0;left:-.4em;color:var(--muted)}
.tag{margin-top:14px;font-size:12.5px;color:var(--amber)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:13px;color:var(--muted);border:1px solid var(--line);padding:7px 14px;border-radius:999px;background:rgba(8,7,6,.6)}
.dot{width:7px;height:7px;border-radius:50%;background:#6b625a}
.status.open .dot{background:#9cc28a;box-shadow:0 0 8px #9cc28a}
.status.open b{color:var(--ivory);font-weight:500}
.cta{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:2px;font-size:14px;border:1px solid var(--line);text-decoration:none;transition:border-color .3s, background .3s}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--ivory);color:#0b0907;border-color:var(--ivory);font-weight:500}
.btn.primary:hover{background:var(--amber);border-color:var(--amber)}

main{max-width:640px;margin:0 auto;padding:0 18px 140px}

/* signature */
.sig{position:relative;margin:8px 0 46px;padding:26px 22px;border:1px solid var(--line);background:linear-gradient(160deg,#16110b,#0b0907 60%);overflow:hidden}
.sig::after{content:&quot;&quot;;position:absolute;inset:-1px;border:1px solid transparent;background:linear-gradient(120deg,transparent 30%,rgba(226,171,106,.55),transparent 70%) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;background-size:250% 100%;animation:sweep 6s linear infinite;pointer-events:none}
@keyframes sweep{from{background-position:150% 0}to{background-position:-100% 0}}
.sig small{font-size:11px;color:var(--amber)}
.sig h2{font-size:24px;font-weight:500;margin-top:8px;text-wrap:balance}
.sig .en{font-size:14px;color:var(--muted);margin-top:2px}
.sig p{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.8}
.sig .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.price{font-variant-numeric:tabular-nums;font-weight:500}
.price span{font-size:11px;color:var(--muted);font-weight:400;margin-inline-start:3px}

/* tabs */
.tabs{position:sticky;top:0;z-index:10;background:rgba(8,7,6,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:15px 12px 13px;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.tab.on{color:var(--ivory);border-color:var(--amber)}

section.cat{padding-top:40px;scroll-margin-top:52px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.cat-head h3{font-size:20px;font-weight:500}
.cat-head .latin{font-size:13px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto 38px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);opacity:1}
.item.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.15;transform:translateY(10px)}}
.item .ar{font-size:15.5px}
.item .en{font-family:var(--display);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.item .cal{font-size:11px;color:var(--muted);margin-top:2px;text-align:center}
.item .price{text-align:center;min-width:56px}
.add{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;transition:all .25s}
.add:hover{border-color:var(--amber);color:var(--amber)}
.add.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.25);background:var(--amber);color:#0b0907;border-color:var(--amber)}}
.item.soldout .ar,.item.soldout .en,.item.soldout .price{opacity:.35}
.item.soldout .add{width:auto;padding:0 8px;border-radius:2px;font-size:11px;color:var(--muted);cursor:default}
.sig [data-add]:disabled{opacity:.5;cursor:default}
.paused-note{display:none;margin-top:14px;font-size:13px;color:var(--amber)}
body.paused .paused-note{display:block}
.qty-badge{font-size:11px;color:var(--amber);margin-top:4px;text-align:center}

.notes{margin-top:46px;display:grid;gap:10px;font-size:13px;color:var(--muted);line-height:1.8}
.info{margin-top:40px;border-top:1px solid var(--line);padding-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.info h4{font-size:12px;color:var(--amber);font-weight:400;margin-bottom:6px}
.info p{font-size:14px;line-height:1.7}
.info a{color:var(--ivory);text-underline-offset:4px;text-decoration-color:var(--amber)}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:56px;line-height:2}

/* cart bar */
#bar{position:fixed;bottom:16px;left:50%;transform:translate(-50%,140%);width:min(608px,calc(100% - 32px));z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;background:var(--ivory);color:#0b0907;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#bar.show{transform:translate(-50%,0)}
#bar b{font-weight:600}
#bar .count{font-size:13px}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;visibility:hidden;transition:.35s}
#scrim.show{opacity:1;visibility:visible}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(640px,100%);max-height:88%;overflow-y:auto;z-index:31;background:var(--panel);border-top:1px solid var(--line);padding:24px 20px 28px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#sheet.show{transform:translate(-50%,0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h3{font-size:19px;font-weight:500}
.x{width:34px;height:34px;border:1px solid var(--line);border-radius:50%}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.stepper{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.stepper button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%}
.label{font-size:12px;color:var(--amber);margin:22px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border:1px solid var(--line);font-size:13px;border-radius:2px}
.chip.on{border-color:var(--amber);color:var(--amber)}
input[type=text],textarea{width:100%;background:#0b0907;border:1px solid var(--line);color:var(--ivory);font:inherit;font-size:14px;padding:12px;border-radius:2px}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus{outline:none;border-color:var(--amber)}
.total{display:flex;justify-content:space-between;margin-top:22px;font-size:16px}
.submit{width:100%;margin-top:16px;padding:15px;background:var(--ivory);color:#0b0907;font-weight:500;border-radius:2px}
.submit:hover{background:var(--amber)}
.err{color:#e08a7a;font-size:12.5px;margin-top:8px;min-height:1em}
.demo-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px}

.done-view{text-align:center;padding:20px 0 6px}
.done-view .glow{width:12px;height:12px;border-radius:50%;margin:10px auto 26px;background:#fff1da;box-shadow:0 0 30px 10px rgba(226,171,106,.7)}
.done-view .num{font-family:var(--display);font-size:52px;letter-spacing:.12em;margin:8px 0}
.done-view p{color:var(--muted);font-size:14px;line-height:1.8}

@media (max-width:420px){.info{grid-template-columns:1fr}.item{gap:10px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

MENU.forEach((c,ci)=&gt;{

/* ---- cart ---- */
function add(id, el){
  cart[id] = (cart[id]||0)+1;
  if(el){ el.classList.remove(&quot;pop&quot;); void el.offsetWidth; el.classList.add(&quot;pop&quot;); }
  sync();
}

  const b = e.target.closest(&quot;[data-add]&quot;); if(b) add(b.dataset.add, b.classList.contains(&quot;add&quot;)?b:null);

function totals(){ let n=0,t=0; for(const k in cart){ n+=cart[k]; t+=cart[k]*BY_ID[k].price; } return {n,t}; }
function sync(){
  const {n,t} = totals();

  document.getElementById(&quot;barCount&quot;).textContent = n + (n===1?&quot; صنف&quot;:n===2?&quot; صنفان&quot;:n&lt;=10?&quot; أصناف&quot;:&quot; صنف&quot;);

const sheet=document.getElementById(&quot;sheet&quot;), scrim=document.getElementById(&quot;scrim&quot;), body=document.getElementById(&quot;sheetBody&quot;);
function openSheet(){ renderCart(); sheet.classList.add(&quot;show&quot;); scrim.classList.add(&quot;show&quot;); }

scrim.onclick=closeSheet;
document.addEventListener(&quot;keydown&quot;,e=&gt;{ if(e.key===&quot;Escape&quot;) closeSheet(); });

function renderCart(){
  const {t} = totals();
  const lines = Object.keys(cart).filter(k=&gt;cart[k]&gt;0).map(k=&gt;{
    const i=BY_ID[k];
    return `&lt;div class=&quot;line&quot;&gt;&lt;div&gt;${i.ar}&lt;div class=&quot;latin&quot; style=&quot;font-size:11px;color:var(--muted);margin-top:2px&quot;&gt;${i.en}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stepper&quot;&gt;&lt;button type=&quot;button&quot; data-dec=&quot;${k}&quot; aria-label=&quot;إنقاص&quot;&gt;−&lt;/button&gt;&lt;span&gt;${cart[k]}&lt;/span&gt;&lt;button type=&quot;button&quot; data-inc=&quot;${k}&quot; aria-label=&quot;زيادة&quot;&gt;+&lt;/button&gt;
      &lt;b class=&quot;price&quot; style=&quot;min-width:48px;text-align:left&quot;&gt;${cart[k]*i.price}&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`;
  }).join(&quot;&quot;);
  const times=[&quot;أقرب وقت&quot;,&quot;بعد ١٥ دقيقة&quot;,&quot;بعد ٣٠ دقيقة&quot;,&quot;بعد ساعة&quot;];
  body.innerHTML = `
    &lt;div class=&quot;sheet-head&quot;&gt;&lt;h3 id=&quot;sheetTitle&quot;&gt;طلبك&lt;/h3&gt;&lt;button class=&quot;x&quot; type=&quot;button&quot; id=&quot;closeX&quot; aria-label=&quot;إغلاق&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;
    ${lines || &#x27;&lt;p style=&quot;color:var(--muted);padding:20px 0&quot;&gt;لا توجد أصناف بعد.&lt;/p&gt;&#x27;}
    &lt;div class=&quot;label&quot;&gt;وقت الاستلام من الكاونتر&lt;/div&gt;
    &lt;div class=&quot;chips&quot;&gt;${times.map(x=&gt;`&lt;button type=&quot;button&quot; class=&quot;chip${x===pickup?&quot; on&quot;:&quot;&quot;}&quot; data-time=&quot;${x}&quot;&gt;${x}&lt;/button&gt;`).join(&quot;&quot;)}&lt;/div&gt;
    &lt;div class=&quot;label&quot;&gt;&lt;label for=&quot;cname&quot;&gt;الاسم على الطلب&lt;/label&gt;&lt;/div&gt;
    &lt;input type=&quot;text&quot; id=&quot;cname&quot; placeholder=&quot;مثال: سارة&quot; autocomplete=&quot;given-name&quot;&gt;
    &lt;div class=&quot;label&quot;&gt;&lt;label for=&quot;cnote&quot;&gt;ملاحظات&lt;/label&gt;&lt;/div&gt;
    &lt;textarea id=&quot;cnote&quot; placeholder=&quot;مثال: حليب شوفان، سكر خفيف&quot;&gt;&lt;/textarea&gt;
    &lt;div class=&quot;total&quot;&gt;&lt;span&gt;الإجمالي&lt;/span&gt;&lt;b class=&quot;price&quot;&gt;${t}&lt;span&gt;ر.س&lt;/span&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;err&quot; id=&quot;err&quot;&gt;&lt;/div&gt;
    &lt;button class=&quot;submit&quot; type=&quot;button&quot; id=&quot;send&quot;&gt;تأكيد الطلب&lt;/button&gt;
    &lt;div class=&quot;demo-note&quot;&gt;نسخة عرض: الطلب لا يُرسل فعليًا للكوفي.&lt;/div&gt;`;
  document.getElementById(&quot;closeX&quot;).onclick=closeSheet;
  document.getElementById(&quot;send&quot;).onclick=confirmOrder;
}
body.addEventListener(&quot;click&quot;,e=&gt;{
  const inc=e.target.closest(&quot;[data-inc]&quot;), dec=e.target.closest(&quot;[data-dec]&quot;), tm=e.target.closest(&quot;[data-time]&quot;);
  if(inc){ cart[inc.dataset.inc]++; keepInputs(renderCart); sync(); }
  if(dec){ const k=dec.dataset.dec; cart[k]--; if(cart[k]&lt;=0) delete cart[k]; keepInputs(renderCart); sync(); if(!totals().n) closeSheet(); }

function keepInputs(fn){
  const n=document.getElementById(&quot;cname&quot;)?.value||&quot;&quot;, m=document.getElementById(&quot;cnote&quot;)?.value||&quot;&quot;;

function confirmOrder(){
  const name=document.getElementById(&quot;cname&quot;).value.trim();

    &lt;button class=&quot;submit&quot; type=&quot;button&quot; id=&quot;again&quot;&gt;رجوع للمنيو&lt;/button&gt;
    &lt;div class=&quot;demo-note&quot;&gt;نسخة عرض: الطلب لا يُرسل فعليًا للكوفي.&lt;/div&gt;&lt;/div&gt;`;

/* ---- dust motes in the lamp light ---- */
(function(){
  const c=document.getElementById(&quot;dust&quot;), x=c.getContext(&quot;2d&quot;); let W,H,P=[];
  function size(){ const r=c.getBoundingClientRect(), d=devicePixelRatio||1; W=r.width;H=r.height; c.width=W*d;c.height=H*d; x.setTransform(d,0,0,d,0,0); }
  size(); addEventListener(&quot;resize&quot;,size);
  for(let i=0;i&lt;46;i++) P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,v:Math.random()*.00025+.00008,p:Math.random()*6.28});
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y-=p.v*16; if(p.y&lt;-.02){p.y=1.02;p.x=Math.random();}
      const px=(p.x-.5)*W*.7+W/2 + Math.sin(t/2400+p.p)*10, py=p.y*H;
      const near=1-Math.min(1,Math.abs(px-W/2)/(W*.35));
      x.globalAlpha=(.15+.6*near)*(0.6+0.4*Math.sin(t/900+p.p));
      x.fillStyle=&quot;#f2c48a&quot;; x.beginPath(); x.arc(px,py,p.r,0,6.28); x.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* Same black room as the customer page; the bar&#x27;s working screen: summary tiles, then orders board in three status lanes. */

.pins.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:58px;border:1px solid var(--line);border-radius:50%;width:58px;margin:auto;font-size:20px;font-family:var(--display);transition:.2s}
.pad button:hover{border-color:var(--amber)}
.pad button:active{background:var(--amber);color:#000}
.hint{font-size:12px;color:var(--muted);margin-top:18px}

/* ---------- SHELL ---------- */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,7,6,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:.2em}
.brand span{font-size:12px;color:var(--muted)}
.clock{font-size:13px;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}

.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.switch-row p{font-size:14px}
.switch-row small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sw{position:relative;width:50px;height:28px;border-radius:999px;background:#2a241c;flex:0 0 auto;transition:.3s}
.sw::after{content:&quot;&quot;;position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.3s}
.sw[aria-checked=&quot;true&quot;]{background:rgba(156,194,138,.25)}
.sw[aria-checked=&quot;true&quot;]::after{right:25px;background:var(--ready);box-shadow:0 0 10px var(--ready)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.tile small{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:26px;font-weight:500;margin-top:4px}
.tile b span{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:4px}

.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto}
.views button{padding:12px 14px;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;white-space:nowrap}
.views button.on{color:var(--ivory);border-color:var(--amber)}
.views .badge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:999px;background:var(--amber);color:#000;font-size:11px;line-height:18px;text-align:center}
.view{display:none}.view.on{display:block}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.lane-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:0 2px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lane-head i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:8px}
.lane-head span{color:var(--muted);font-size:13px}
.lane{display:grid;gap:10px}
.empty{font-size:13px;color:var(--muted);padding:18px 4px}
.card{border:1px solid var(--line);background:var(--raised);padding:14px;border-inline-start:2px solid var(--c)}
.card.fresh{animation:fresh 2.4s}
@keyframes fresh{0%,40%{box-shadow:0 0 0 1px var(--amber),0 0 30px rgba(226,171,106,.35)}}
.card-top{display:flex;justify-content:space-between;align-items:baseline}
.card-top b{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:.06em}
.card-top span{font-size:12px;color:var(--muted)}
.who{font-size:14px;margin-top:2px}
.pick{font-size:12px;color:var(--amber);margin-top:2px}
.card ul{list-style:none;margin:10px 0;padding:10px 0;border-block:1px dashed var(--line);display:grid;gap:5px;font-size:13.5px}
.card li{display:flex;justify-content:space-between;gap:8px}
.card li span{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.go{padding:9px 14px;font-size:13px;background:var(--ivory);color:#0b0907;font-weight:500;border-radius:2px}
.go:hover{background:var(--amber)}
.ghost{font-size:12px;color:var(--muted);padding:6px}

/* menu control */
.mgroup{margin-bottom:26px}
.mgroup h3{font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mgroup h3 span{font-size:12px;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mrow .nm{font-size:14.5px}
.mrow .nm small{display:block;font-size:12px;color:var(--muted)}
.mrow.off .nm{opacity:.45}
.mrow .r{display:flex;align-items:center;gap:14px}
.state{font-size:12px;color:var(--ready);min-width:44px;text-align:center}
.mrow.off .state{color:#e08a7a}

/* report */
.report{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.box{border:1px solid var(--line);background:var(--panel);padding:16px}
.box h4{font-size:13px;color:var(--amber);font-weight:400;margin-bottom:14px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;background:#1e1913;position:relative;overflow:hidden}
.bar .t i{position:absolute;inset-block:0;right:0;background:linear-gradient(270deg,var(--amber),#9a5a24)}
.bar b{font-weight:500;text-align:left}
svg text{fill:var(--muted);font-size:10px;font-family:var(--body)}

#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,160%);background:var(--ivory);color:#0b0907;padding:12px 18px;font-size:14px;border-radius:2px;z-index:30;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#toast.show{transform:translate(-50%,0)}
.demo{font-size:11.5px;color:var(--muted);text-align:center;margin-top:30px}

@media (max-width:860px){.board{grid-template-columns:1fr}.report{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.bar{grid-template-columns:100px 1fr 30px}.clock{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  &lt;div class=&quot;demo&quot;&gt;نسخة عرض: الطلبات المحفوظة في هذا المتصفح فقط. أي طلب من صفحة الزبون على نفس الجهاز يظهر هنا مباشرة.&lt;/div&gt;

&lt;div id=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

&lt;script&gt;
const MENU = [
  {ar:&quot;القهوة المختصة&quot;, en:&quot;Specialty Coffee&quot;, items:[
    [&quot;s1&quot;,&quot;V60 حار&quot;,18],[&quot;s2&quot;,&quot;V60 بارد&quot;,20],[&quot;s3&quot;,&quot;V60 حار فاخر&quot;,22],[&quot;s4&quot;,&quot;V60 بارد فاخر&quot;,24],[&quot;s5&quot;,&quot;قهوة اليوم حار&quot;,12],[&quot;s6&quot;,&quot;قهوة اليوم بارد&quot;,13]]},
  {ar:&quot;مشروبات الإسبريسو&quot;, en:&quot;Espresso Drinks&quot;, items:[
    [&quot;e1&quot;,&quot;إسبريسو&quot;,12],[&quot;e2&quot;,&quot;أمريكانو&quot;,13],[&quot;e3&quot;,&quot;إسبريسو نوت&quot;,19],[&quot;e4&quot;,&quot;كورتادو&quot;,14],[&quot;e5&quot;,&quot;فلات وايت&quot;,15],[&quot;e6&quot;,&quot;كابتشينو&quot;,15],[&quot;e7&quot;,&quot;لاتيه&quot;,16],[&quot;e8&quot;,&quot;سبانش لاتيه&quot;,18]]},
  {ar:&quot;المشروبات الباردة&quot;, en:&quot;Cold Drinks&quot;, items:[
    [&quot;c1&quot;,&quot;آيس دولتشي أمريكانو&quot;,20],[&quot;c2&quot;,&quot;آيس أمريكانو&quot;,14],[&quot;c3&quot;,&quot;آيس لاتيه&quot;,17],[&quot;c4&quot;,&quot;آيس سبانش لاتيه&quot;,19],[&quot;c5&quot;,&quot;ألفريدو&quot;,16],[&quot;c6&quot;,&quot;كلاودي كركديه&quot;,20],
    [&quot;c7&quot;,&quot;آيس ماتشا لاتيه&quot;,20],[&quot;c8&quot;,&quot;سبانش ماتشا لاتيه&quot;,22],[&quot;c9&quot;,&quot;ماتشا كلاود&quot;,23],[&quot;c10&quot;,&quot;ماتشا سولتد كراميل&quot;,17],[&quot;c11&quot;,&quot;ماتشا ستروبري&quot;,17],[&quot;c12&quot;,&quot;آيس تي خوخ و ليمون&quot;,18],[&quot;c13&quot;,&quot;مياه&quot;,1]]},
  {ar:&quot;الحلويات&quot;, en:&quot;Desserts&quot;, items:[
    [&quot;d1&quot;,&quot;بيكان تارت&quot;,22],[&quot;d2&quot;,&quot;سولتد كراميل شوكلت&quot;,17],[&quot;d3&quot;,&quot;ماجيك بار&quot;,16],[&quot;d4&quot;,&quot;سينابون تشيز كيك كراميل&quot;,26],[&quot;d5&quot;,&quot;تربل دارك شوكلت&quot;,26],[&quot;d6&quot;,&quot;بابكا شوكلت&quot;,18]]}
];
const ITEM = {}; MENU.forEach(c=&gt;c.items.forEach(i=&gt;ITEM[i[0]]={ar:i[1],price:i[2]}));

const mem = {};
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return k in mem?mem[k]:d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const esc = s =&gt; String(s).replace(/[&lt;&gt;&amp;&quot;]/g, c=&gt;({&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;}[c]));

/* sample orders so the board opens in a working state */
function seed(){
  if(store.get(&quot;nott_seeded&quot;,false)) return;
  const now=Date.now(), m=60000;
  const mk=(num,name,items,mins,status,pickup,note)=&gt;({num,name,items,status,pickup:pickup||&quot;أقرب وقت&quot;,note:note||&quot;&quot;,t:now-mins*m,
    total:items.reduce((a,[k,q])=&gt;a+ITEM[k].price*q,0)});
  const sample=[
    mk(214,&quot;عبدالله&quot;,[[&quot;e8&quot;,2],[&quot;d6&quot;,1]],2,&quot;new&quot;,&quot;بعد ١٥ دقيقة&quot;),
    mk(213,&quot;ريم&quot;,[[&quot;c1&quot;,1],[&quot;d4&quot;,1]],5,&quot;new&quot;,&quot;أقرب وقت&quot;,&quot;حليب شوفان&quot;),
    mk(211,&quot;فهد&quot;,[[&quot;s1&quot;,1],[&quot;e3&quot;,1]],9,&quot;prep&quot;),
    mk(209,&quot;نوف&quot;,[[&quot;c9&quot;,2],[&quot;c11&quot;,1]],14,&quot;prep&quot;,&quot;بعد ٣٠ دقيقة&quot;,&quot;سكر خفيف&quot;),
    mk(206,&quot;سلطان&quot;,[[&quot;c4&quot;,1],[&quot;d1&quot;,1]],22,&quot;ready&quot;),
    mk(201,&quot;لمى&quot;,[[&quot;e7&quot;,1],[&quot;d2&quot;,2]],48,&quot;done&quot;),
    mk(198,&quot;خالد&quot;,[[&quot;e1&quot;,2],[&quot;c2&quot;,1]],70,&quot;done&quot;),
    mk(192,&quot;هيا&quot;,[[&quot;c1&quot;,2],[&quot;d5&quot;,1]],115,&quot;done&quot;),
    mk(187,&quot;ماجد&quot;,[[&quot;s4&quot;,1]],150,&quot;done&quot;),
    mk(181,&quot;جود&quot;,[[&quot;c7&quot;,1],[&quot;c1&quot;,1],[&quot;d3&quot;,1]],190,&quot;done&quot;)
  ];
  store.set(&quot;nott_orders&quot;,[...store.get(&quot;nott_orders&quot;,[]),...sample]);
  store.set(&quot;nott_seeded&quot;,true);
}

/* ---------- lock ---------- */
let pin=&quot;&quot;;
const pad=document.getElementById(&quot;pad&quot;), pins=document.getElementById(&quot;pins&quot;), lock=document.getElementById(&quot;lock&quot;);
[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;,&quot;5&quot;,&quot;6&quot;,&quot;7&quot;,&quot;8&quot;,&quot;9&quot;,&quot;&quot;,&quot;0&quot;,&quot;⌫&quot;].forEach(k=&gt;{
  const b=document.createElement(&quot;button&quot;); b.type=&quot;button&quot;; b.textContent=k;
  if(!k){ b.style.visibility=&quot;hidden&quot;; b.tabIndex=-1; }
  b.onclick=()=&gt;press(k); pad.appendChild(b);
});
function press(k){
  if(k===&quot;⌫&quot;){ pin=pin.slice(0,-1); } else if(pin.length&lt;4){ pin+=k; }
  [...pins.children].forEach((d,i)=&gt;d.classList.toggle(&quot;on&quot;,i&lt;pin.length));
  if(pin.length===4){
    if(pin===&quot;1234&quot;){ lock.classList.add(&quot;lit&quot;); setTimeout(()=&gt;lock.classList.add(&quot;gone&quot;),900); }
    else { pins.classList.add(&quot;shake&quot;); setTimeout(()=&gt;{pins.classList.remove(&quot;shake&quot;);pin=&quot;&quot;;[...pins.children].forEach(d=&gt;d.classList.remove(&quot;on&quot;));},420); }
  }
}
addEventListener(&quot;keydown&quot;,e=&gt;{ if(lock.classList.contains(&quot;gone&quot;)) return; if(/^\d$/.test(e.key)) press(e.key); if(e.key===&quot;Backspace&quot;) press(&quot;⌫&quot;); });

/* ---------- clock ---------- */
function tick(){ document.getElementById(&quot;clock&quot;).textContent = new Intl.DateTimeFormat(&quot;ar-SA-u-nu-latn&quot;,{weekday:&quot;long&quot;,hour:&quot;numeric&quot;,minute:&quot;2-digit&quot;,timeZone:&quot;Asia/Riyadh&quot;}).format(new Date()); }
tick(); setInterval(tick,30000);

/* ---------- views ---------- */
document.querySelectorAll(&quot;.views button&quot;).forEach(b=&gt;b.onclick=()=&gt;{
  document.querySelectorAll(&quot;.views button&quot;).forEach(x=&gt;x.classList.toggle(&quot;on&quot;,x===b));
  document.querySelectorAll(&quot;.view&quot;).forEach(v=&gt;v.classList.toggle(&quot;on&quot;,v.id===&quot;v-&quot;+b.dataset.v));
  if(b.dataset.v===&quot;report&quot;) renderReport();
});

/* ---------- orders ---------- */
const NEXT={new:[&quot;prep&quot;,&quot;ابدأ التحضير&quot;],prep:[&quot;ready&quot;,&quot;جاهز&quot;],ready:[&quot;done&quot;,&quot;تم الاستلام&quot;]};
function ago(t){ const m=Math.max(0,Math.round((Date.now()-t)/60000)); return m&lt;1?&quot;الآن&quot;:m===1?&quot;قبل دقيقة&quot;:m===2?&quot;قبل دقيقتين&quot;:m&lt;=10?`قبل ${m} دقائق`:m&lt;60?`قبل ${m} دقيقة`:`قبل ${Math.floor(m/60)} س`; }
let known=new Set();
function render(fresh){
  const orders=store.get(&quot;nott_orders&quot;,[]);
  const start=new Date(); start.setHours(0,0,0,0);
  const today=orders.filter(o=&gt;o.t&gt;=start.getTime()-6*3600e3);
  [&quot;new&quot;,&quot;prep&quot;,&quot;ready&quot;].forEach(st=&gt;{
    const list=today.filter(o=&gt;o.status===st).sort((a,b)=&gt;a.t-b.t);
    document.getElementById(&quot;c-&quot;+st).textContent=list.length;
    const lane=document.getElementById(&quot;l-&quot;+st);
    lane.innerHTML = list.length ? list.map(o=&gt;`
      &lt;article class=&quot;card${fresh&amp;&amp;fresh.has(o.num)?&quot; fresh&quot;:&quot;&quot;}&quot; style=&quot;--c:var(--${st})&quot;&gt;
        &lt;div class=&quot;card-top&quot;&gt;&lt;b class=&quot;num&quot;&gt;#${o.num}&lt;/b&gt;&lt;span&gt;${ago(o.t)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;who&quot;&gt;${esc(o.name)}&lt;/div&gt;
        &lt;div class=&quot;pick&quot;&gt;الاستلام: ${esc(o.pickup)}&lt;/div&gt;
        &lt;ul&gt;${o.items.map(([k,q])=&gt;`&lt;li&gt;${ITEM[k]?ITEM[k].ar:k}&lt;span class=&quot;num&quot;&gt;×${q}&lt;/span&gt;&lt;/li&gt;`).join(&quot;&quot;)}&lt;/ul&gt;
        ${o.note?`&lt;div class=&quot;note&quot;&gt;ملاحظة: ${esc(o.note)}&lt;/div&gt;`:&quot;&quot;}
        &lt;div class=&quot;card-foot&quot;&gt;&lt;span class=&quot;num&quot; style=&quot;font-size:13px&quot;&gt;${o.total} ر.س&lt;/span&gt;
          &lt;div&gt;${st===&quot;new&quot;?`&lt;button class=&quot;ghost&quot; type=&quot;button&quot; data-cancel=&quot;${o.num}&quot;&gt;إلغاء&lt;/button&gt;`:&quot;&quot;}&lt;button class=&quot;go&quot; type=&quot;button&quot; data-move=&quot;${o.num}&quot;&gt;${NEXT[st][1]}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/article&gt;`).join(&quot;&quot;) : `&lt;div class=&quot;empty&quot;&gt;لا توجد طلبات&lt;/div&gt;`;
  });
  const valid=today.filter(o=&gt;o.status!==&quot;cancel&quot;);
  const sales=valid.reduce((a,o)=&gt;a+o.total,0);
  document.getElementById(&quot;tOrders&quot;).textContent=valid.length;
  document.getElementById(&quot;tSales&quot;).innerHTML=sales+&quot;&lt;span&gt;ر.س&lt;/span&gt;&quot;;
  document.getElementById(&quot;tWait&quot;).textContent=today.filter(o=&gt;o.status===&quot;new&quot;||o.status===&quot;prep&quot;).length;
  document.getElementById(&quot;tAvg&quot;).innerHTML=(valid.length?Math.round(sales/valid.length):0)+&quot;&lt;span&gt;ر.س&lt;/span&gt;&quot;;
  const n=today.filter(o=&gt;o.status===&quot;new&quot;).length;
  const bdg=document.getElementById(&quot;newBadge&quot;); bdg.textContent=n; bdg.style.display=n?&quot;&quot;:&quot;none&quot;;
  document.title = n ? `(${n}) إدارة نوت` : &quot;إدارة نوت&quot;;
  known=new Set(orders.map(o=&gt;o.num));
}
document.addEventListener(&quot;click&quot;,e=&gt;{
  const mv=e.target.closest(&quot;[data-move]&quot;), cn=e.target.closest(&quot;[data-cancel]&quot;);
  if(!mv&amp;&amp;!cn) return;
  const orders=store.get(&quot;nott_orders&quot;,[]);
  const o=orders.find(x=&gt;String(x.num)===(mv||cn).dataset[mv?&quot;move&quot;:&quot;cancel&quot;]); if(!o) return;
  if(mv){ o.status=NEXT[o.status][0]; toast(o.status===&quot;ready&quot;?`الطلب #${o.num} جاهز، نادِ ${o.name}`:o.status===&quot;done&quot;?`تم تسليم الطلب #${o.num}`:`بدأ تحضير الطلب #${o.num}`); }
  else { o.status=&quot;cancel&quot;; toast(`أُلغي الطلب #${o.num}`); }
  store.set(&quot;nott_orders&quot;,orders); render();
});

/* new orders from the customer page (same browser) */
addEventListener(&quot;storage&quot;,e=&gt;{
  if(e.key!==&quot;nott_orders&quot;) return;
  const orders=store.get(&quot;nott_orders&quot;,[]);
  const fresh=new Set(orders.filter(o=&gt;!known.has(o.num)).map(o=&gt;o.num));
  render(fresh);
  if(fresh.size){ const o=orders.find(x=&gt;fresh.has(x.num)); toast(`طلب جديد #${o.num} من ${o.name}`); }
});
setInterval(()=&gt;render(),60000);

let tt;
function toast(msg){ const t=document.getElementById(&quot;toast&quot;); t.textContent=msg; t.classList.add(&quot;show&quot;); clearTimeout(tt); tt=setTimeout(()=&gt;t.classList.remove(&quot;show&quot;),2600); }

/* ---------- pause switch ---------- */
const sw=document.getElementById(&quot;pauseSw&quot;);
function paintSw(){
  const paused=store.get(&quot;nott_paused&quot;,false);
  sw.setAttribute(&quot;aria-checked&quot;, String(!paused));
  document.getElementById(&quot;pauseSub&quot;).textContent = paused ? &quot;متوقف: صفحة الزبون تطلب منهم الطلب من الكاونتر&quot; : &quot;الزبائن يقدرون يطلبون من الصفحة الآن&quot;;
}
sw.onclick=()=&gt;{ const p=!store.get(&quot;nott_paused&quot;,false); store.set(&quot;nott_paused&quot;,p); paintSw(); toast(p?&quot;أوقفت استقبال الطلب المسبق&quot;:&quot;رجع استقبال الطلب المسبق&quot;); };

/* ---------- menu availability ---------- */
function renderMenu(){
  const out=store.get(&quot;nott_soldout&quot;,[]);
  document.getElementById(&quot;mlist&quot;).innerHTML = MENU.map(c=&gt;`&lt;div class=&quot;mgroup&quot;&gt;&lt;h3&gt;${c.ar}&lt;span class=&quot;latin&quot;&gt;${c.en}&lt;/span&gt;&lt;/h3&gt;${
    c.items.map(([id,ar,p])=&gt;{ const off=out.includes(id); return `&lt;div class=&quot;mrow${off?&quot; off&quot;:&quot;&quot;}&quot;&gt;
      &lt;div class=&quot;nm&quot;&gt;${ar}&lt;small class=&quot;num&quot;&gt;${p} ر.س&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;r&quot;&gt;&lt;span class=&quot;state&quot;&gt;${off?&quot;نفد&quot;:&quot;متوفر&quot;}&lt;/span&gt;&lt;button class=&quot;sw&quot; type=&quot;button&quot; role=&quot;switch&quot; aria-checked=&quot;${!off}&quot; aria-label=&quot;توفر ${ar}&quot; data-avail=&quot;${id}&quot;&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`; }).join(&quot;&quot;)
  }&lt;/div&gt;`).join(&quot;&quot;);
}
document.getElementById(&quot;mlist&quot;).addEventListener(&quot;click&quot;,e=&gt;{
  const b=e.target.closest(&quot;[data-avail]&quot;); if(!b) return;
  let out=store.get(&quot;nott_soldout&quot;,[]); const id=b.dataset.avail;
  out = out.includes(id) ? out.filter(x=&gt;x!==id) : [...out,id];
  store.set(&quot;nott_soldout&quot;,out); renderMenu();
  toast(out.includes(id)?`${ITEM[id].ar}: نفد`:`${ITEM[id].ar}: متوفر`);
});

/* ---------- report ---------- */
function renderReport(){
  const orders=store.get(&quot;nott_orders&quot;,[]).filter(o=&gt;o.status!==&quot;cancel&quot; &amp;&amp; Date.now()-o.t&lt;24*3600e3);
  const cnt={}; orders.forEach(o=&gt;o.items.forEach(([k,q])=&gt;cnt[k]=(cnt[k]||0)+q));
  const top=Object.entries(cnt).sort((a,b)=&gt;b[1]-a[1]).slice(0,6);
  const max=top.length?top[0][1]:1;
  document.getElementById(&quot;top&quot;).innerHTML = top.length ? top.map(([k,q])=&gt;`&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;${ITEM[k].ar}&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i style=&quot;width:${q/max*100}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;b class=&quot;num&quot;&gt;${q}&lt;/b&gt;&lt;/div&gt;`).join(&quot;&quot;) : &#x27;&lt;div class=&quot;empty&quot;&gt;لا توجد مبيعات بعد&lt;/div&gt;&#x27;;
  // sales by hour, last 8 hours
  const hrs=[]; const now=new Date();
  for(let i=7;i&gt;=0;i--){ const d=new Date(now.getTime()-i*3600e3); hrs.push({h:d.getHours(),v:0,start:new Date(d).setMinutes(0,0,0)}); }
  orders.forEach(o=&gt;{ const b=hrs.find(x=&gt;o.t&gt;=x.start&amp;&amp;o.t&lt;x.start+3600e3); if(b) b.v+=o.total; });
  const W=360,H=170,pad=24,top0=14, mx=Math.max(50,...hrs.map(x=&gt;x.v)); const nice=Math.ceil(mx/50)*50;
  const bw=(W-pad*2)/hrs.length;
  let svg=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;100%&quot; direction=&quot;ltr&quot; style=&quot;direction:ltr&quot; role=&quot;img&quot; aria-label=&quot;المبيعات حسب الساعة&quot;&gt;`;
  [0,.5,1].forEach(f=&gt;{ const y=H-pad-(H-pad-top0)*f; svg+=`&lt;line x1=&quot;${pad}&quot; x2=&quot;${W-6}&quot; y1=&quot;${y}&quot; y2=&quot;${y}&quot; stroke=&quot;#2a241c&quot;/&gt;&lt;text x=&quot;2&quot; y=&quot;${y+3}&quot;&gt;${Math.round(nice*f)}&lt;/text&gt;`; });
  hrs.forEach((x,i)=&gt;{ const h=(H-pad-top0)*x.v/nice, X=pad+i*bw+bw*.22, last=i===hrs.length-1;
    svg+=`&lt;rect x=&quot;${X}&quot; y=&quot;${H-pad-h}&quot; width=&quot;${bw*.56}&quot; height=&quot;${h}&quot; fill=&quot;${last?&quot;#e2ab6a&quot;:&quot;#6b4a2a&quot;}&quot;/&gt;`;
    if(x.v) svg+=`&lt;text x=&quot;${X+bw*.28}&quot; y=&quot;${H-pad-h-4}&quot; text-anchor=&quot;middle&quot; style=&quot;fill:${last?&quot;#efe6d6&quot;:&quot;#8c8273&quot;}&quot;&gt;${x.v}&lt;/text&gt;`;
    svg+=`&lt;text x=&quot;${X+bw*.28}&quot; y=&quot;${H-8}&quot; text-anchor=&quot;middle&quot;&gt;${x.h}&lt;/text&gt;`; });
  document.getElementById(&quot;hours&quot;).innerHTML=svg+&quot;&lt;/svg&gt;&quot;;
}

seed(); paintSw(); render(); renderMenu(); renderReport();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
