<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>يوفو | اصنع مشروبك</title><link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="builder.css">
<style>.top{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:2.5px solid var(--ink)}.top .wrap{display:flex;align-items:center;height:64px;gap:10px}.top img{height:46px}</style>
</head><body>
<header class="top"><div class="wrap"><img src="logo.webp" alt="يوفو"><span class="tag" style="background:var(--yellow);margin-inline-start:auto">ديمو</span></div></header>
<div class="wrap"><div id="m"></div><p class="small muted" style="text-align:center">نسخة عرض لفكرة «اصنع مشروبك» — في الموقع الحقيقي يُضاف المشروب للسلة بسعره وخياراته.</p></div>
<div id="toast"></div>
<script src="builder.js"></script>
<script>
const P={id:'demo',name:'ماتشا على مزاجك',price:18,options:[
      { name: 'النكهات', type: 'multi', required: false, max: 3, role: 'base', choices: [['فراولة', '#E8394A'], ['مانجو', '#FFA62B'], ['توت أزرق', '#5B3E9E'], ['خوخ', '#FF7A45'], ['فستق', '#B8C96A'], ['يوبي', '#8E6BBF']].map(([n, c]) => ({ name: n, price: 3, color: c })) },
      { name: 'الحليب', type: 'single', required: true, role: 'milk', choices: [['كامل الدسم', '#FFF8EC', 0], ['شوفان', '#F3E3C3', 2], ['جوز الهند', '#FFFDF7', 2], ['لوز', '#F1E2CF', 2]].map(([n, c, pr]) => ({ name: n, price: pr, color: c })) },
      { name: 'الماتشا', type: 'single', required: true, role: 'top', choices: [{ name: 'ماتشا كلاسيك', price: 0, color: '#8DB255' }, { name: 'سيريمونيال', price: 4, color: '#6E9A3A' }] },
      { name: 'الثلج', type: 'single', required: true, role: 'ice', choices: [{ name: 'ثلج عادي', price: 0 }, { name: 'ثلج كثير', price: 0 }, { name: 'بدون ثلج', price: 0 }] },
      { name: 'إضافات', type: 'multi', required: false, role: 'extra', choices: [{ name: 'كريمة مخفوقة', price: 3, color: '#FFFFFF' }] }
]};
UFOBuilder.mount(document.getElementById('m'),P,{title:P.name,subtitle:'اختر، اخفق، صبّ… وكوبك يتكوّن قدامك ✦',logo:'logo.webp',onAdd:(o,q)=>{const t=document.getElementById('toast');t.textContent='انضاف '+q+' للسلة ✦ (ديمو)';t.className='on';setTimeout(()=>t.className='',2500)}});
</script></body></html>
